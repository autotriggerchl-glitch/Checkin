<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CPD Board">
<title>Department display</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B1426; --panel: #13213A; --panel2: #1A2C4C; --line: #2A3F66; --ink: #EEF2F8; --muted: #9FB0CC;
    --gold: #C8A64B; --ok: #3FBF7F; --warn: #F2B544; --err: #FF6B5E; --blue: #2B4677;
    --ot-bg: rgba(255, 107, 94, .16); --lv-bg: rgba(242, 181, 68, .16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font: 400 clamp(13px, 1.05vw, 34px)/1.3 "Segoe UI", Roboto, Arial, sans-serif; }
  /* The mouse hides after 3 seconds without moving (so it doesn't sit on a TV), and comes back when it moves. */
  body.idle, body.idle * { cursor: none !important; }
  .screen { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; }
  /* Header */
  .hd { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 1.2em; padding: .6em 1.2em; background: var(--panel); border-bottom: .2em solid var(--gold); }
  .hd img { height: 3.2em; width: 3.2em; object-fit: contain; }
  .hd .dept { font-size: .8em; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .hd .bname { font-size: 1.7em; font-weight: 800; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hd .right { text-align: right; white-space: nowrap; }
  .hd .clock { font-size: 2.2em; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .hd .date { color: var(--muted); font-weight: 600; margin-top: .2em; }
  .hd .wx { color: var(--muted); font-size: .9em; margin-top: .1em; }
  /* Weather warning bar */
  .wxa { background: #7A1712; color: #fff; padding: .45em 1.2em; font-weight: 700; display: flex; gap: .8em; align-items: baseline; }
  .wxa.minor { background: #6B4A06; }
  .sst { background: #B3261E; color: #fff; padding: .45em 1.2em; font-weight: 700; display: flex; gap: .8em; align-items: baseline; font-size: 1.15em; }
  .sst b { text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  .sst span { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wxa b { text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  .wxa span { opacity: .92; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Right now banner */
  .ban { display: grid; grid-template-columns: repeat(auto-fit, minmax(9em, 1fr)); gap: .8em; padding: .8em .8em 0; }
  .bx { background: var(--panel); border: 1px solid var(--line); border-left: .4em solid var(--line); border-radius: .6em; padding: .45em .9em; min-width: 0; }
  .bx .k { color: var(--muted); font-size: .85em; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .bx .v { font-size: 2.6em; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .bx .v small { font-size: .42em; color: var(--muted); font-weight: 700; margin-left: .3em; }
  .bx .s { color: var(--muted); font-size: .85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bx.good { border-left-color: var(--ok); } .bx.good .v { color: var(--ok); }
  .bx.bad { border-left-color: var(--err); } .bx.bad .v { color: var(--err); }
  .bx.mid { border-left-color: var(--warn); } .bx.mid .v { color: var(--warn); }
  .bx.det { border-left-color: #9C7A22; } .bx.det .v { color: #9C7A22; }
  /* Body grid */
  .body { position: relative; padding: .8em; display: grid; gap: .8em; min-height: 0; }
  .l-one { grid-template: minmax(0, 1fr) / 1fr; }
  .l-two { grid-template: minmax(0, 1fr) / 1fr 1fr; }
  .l-side { grid-template: minmax(0, 1fr) / 2fr 1fr; }
  .l-three { grid-template: minmax(0, 1fr) minmax(0, 1fr) / 2fr 1fr; }
  .l-three > .tile:first-child { grid-row: 1 / 3; }
  .l-four { grid-template: minmax(0, 1fr) minmax(0, 1fr) / 1fr 1fr; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: .7em; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; container-type: inline-size; }
  .tile > h2 { margin: 0; padding: .45em .8em; background: var(--panel2); font-size: 1.05em; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); display: flex; justify-content: space-between; gap: 1em; }
  .tile > h2 small { color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 600; white-space: nowrap; }
  .tile .in { flex: 1; overflow: hidden; padding: .6em .8em; position: relative; }
  .tile .scroll { will-change: transform; }
  .empty { color: var(--muted); padding: 1em 0; }
  /* Who's working: reads like the duty sheet */
  .shifts { display: grid; grid-template-columns: repeat(auto-fit, minmax(30em, 1fr)); gap: .4em 1.2em; }
  .shift { margin-bottom: .6em; min-width: 0; container-type: inline-size; }
  .shift > h3 { margin: 0; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; gap: .6em; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .shift > h3 .cnt { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: .85em; }
  .shift.now > h3 .nm { color: var(--ok); }
  .shift.now > h3 .nm::after { content: "NOW"; margin-left: .5em; background: var(--ok); color: #062512; border-radius: .3em; padding: 0 .4em; font-size: .8em; }
  .stl { margin: .15em 0 .35em; font-weight: 700; font-size: .92em; color: var(--muted); }
  .stl.ok { color: var(--ok); } .stl.bad { color: var(--err); }
  .pr, .ph { --c-cs: 4.2em; --c-hr: 7.6em; --c-cr: 4em; --c-pat: minmax(5.5em, .9fr); --c-duty: 5.6em; --c-brk: 4em;
    display: grid; grid-template-columns: var(--c-cs) minmax(11em, 1.8fr) var(--c-hr) var(--c-cr) var(--c-pat) var(--c-duty) var(--c-brk); align-items: center; }
  .pr > *, .ph > * { padding-right: .6em; min-width: 0; }
  .pr > .cs, .ph > .cs { padding-right: 0; margin-right: .6em; }
  .ph { color: var(--muted); font-size: .72em; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 0 .4em .15em; }
  .pr { padding: .28em .4em; border-radius: .35em; border-bottom: 1px solid rgba(255,255,255,.06); border-left: .3em solid transparent; }
  .pr .cs { position: relative; background: var(--blue); border-radius: .3em; text-align: center; font-weight: 800; font-size: .95em; padding: .05em 0; }
  .pr.sup .cs { background: var(--gold); color: #1B1405; }
  .pr.on .cs::after { content: ""; position: absolute; right: -.25em; top: -.25em; width: .55em; height: .55em; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 .12em var(--panel); }
  .pr .who { min-width: 0; display: flex; align-items: baseline; gap: .45em; overflow: hidden; }
  .pr .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  .pr .who .pill { flex: none; }
  .pr .rk { color: var(--muted); font-size: .8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 100 auto; min-width: 0; }
  /* Group labels inside a shift: Supervisors, Patrol, Overtime, Off */
  .pg { margin: .55em 0 .1em; padding: 0 .4em; color: var(--muted); font-weight: 700; font-size: .82em; }
  .pg span { display: inline-block; min-width: 1.5em; text-align: center; margin-left: .3em; border-radius: 1em; background: var(--panel2); color: var(--ink); font-size: .9em; }
  .ph + .pg { margin-top: .1em; }
  .pill { flex: none; border-radius: .3em; padding: 0 .4em; font-size: .78em; font-weight: 800; white-space: nowrap; }
  .pill.ot { background: var(--err); color: #2A0503; }
  .pill.lv { background: var(--warn); color: #2A1C00; }
  .pill.tag { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); font-weight: 700; }
  /* Not in yet: coming in later today */
  .pill.up { background: transparent; color: var(--muted); border: 1px dashed var(--muted); font-weight: 700; }
  .pr.up .nm, .pr.up .hr, .pr.up .cr { opacity: .75; }
  .pr .hr { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .pr .hr .lv { display: block; color: var(--warn); font-size: .8em; }
  .pr .cr { font-weight: 700; text-align: center; }
  .pr .pat { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr .duty, .pr .brk { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr .brk, .ph .brk, .ph .cr { text-align: center; }
  /* Columns turned off in the board editor */
  .no-cs .pr, .no-cs .ph { --c-cs: 0px; } .no-cs .cs { display: none; }
  .no-hr .pr, .no-hr .ph { --c-hr: 0px; } .no-hr .hr { display: none; }
  .no-cr .pr, .no-cr .ph { --c-cr: 0px; } .no-cr .cr { display: none; }
  .no-pat .pr, .no-pat .ph { --c-pat: 0px; } .no-pat .pat { display: none; }
  .no-duty .pr, .no-duty .ph { --c-duty: 0px; } .no-duty .duty { display: none; }
  .no-brk .pr, .no-brk .ph { --c-brk: 0px; } .no-brk .brk { display: none; }
  .no-rank .rk { display: none; }
  .no-dot .pr.on .cs::after { display: none; }
  /* Text size picked in the board editor */
  .tile.sz-l { font-size: 1.25em; } .tile.sz-xl { font-size: 1.55em; } .tile.sz-s { font-size: .85em; }
  .tile.sz-l > h2, .tile.sz-xl > h2 { font-size: .95em; }
  /* Training: who's signed in */
  .ppl { margin: .2em 0 .1em; display: flex; flex-wrap: wrap; gap: .3em; align-items: baseline; }
  .ppl > b { color: var(--muted); font-size: .8em; text-transform: uppercase; letter-spacing: .05em; margin-right: .2em; }
  .ppl .chip { background: var(--panel2); border-radius: .35em; padding: .05em .45em; font-size: .9em; white-space: nowrap; }
  .ppl .chip i { font-style: normal; color: var(--muted); margin-right: .3em; font-weight: 700; }
  .ppl.miss > b { color: var(--err); } .ppl.miss .chip { background: rgba(255,107,94,.16); }
  .ppl.miss .chip.never { border: 1px solid var(--err); }
  .pr.st-ot { background: var(--ot-bg); border-left-color: var(--err); }
  .pr.st-leave { background: var(--lv-bg); border-left-color: var(--warn); }
  .pr.st-leave .nm { color: #F6E1B0; }
  .pr.st-leave .cr, .pr.st-leave .pat, .pr.st-leave .duty, .pr.st-leave .brk, .pr.st-leave .hr { opacity: .55; }
  .pr.st-part { background: linear-gradient(90deg, var(--lv-bg) 0 50%, transparent 50%); border-left-color: var(--warn); }
  .pr.st-part.st-part-ot { background: linear-gradient(90deg, var(--lv-bg) 0 50%, var(--ot-bg) 50%); }
  /* Narrow panels drop the smaller columns first. */
  /* A shift too narrow for every column: each person on two lines instead
     (call sign, name and hours; then car, patrol, duty and break). */
  @container (max-width: 46em) {
    .ph { display: none; }
    .pr { grid-template-columns: 3.6em minmax(0, 1fr) auto; grid-template-areas: "cs who hr" "cs meta meta"; row-gap: .1em; align-items: center; }
    .pr > .cs { grid-area: cs; align-self: start; margin: .1em .6em 0 0; }
    .pr > .who { grid-area: who; } .pr > .hr { grid-area: hr; text-align: right; padding-right: 0; }
    .pr > .cr, .pr > .pat, .pr > .duty, .pr > .brk { display: none !important; }
    .pr > .meta { grid-area: meta; display: flex; flex-wrap: wrap; gap: .15em .9em; font-size: .88em; color: var(--muted); }
    .pr .meta b { color: var(--ink); font-weight: 600; }
    .pr .meta i { font-style: normal; opacity: .8; }
    .pr .hr .lv { white-space: nowrap; }
    .pr.st-part { background: linear-gradient(180deg, var(--lv-bg) 0 100%); }
    .pr .rk { display: none; }
  }
  .chg { animation: flash 2s ease-in-out 0s 8; }
  @keyframes flash { 0%, 100% { box-shadow: none; } 50% { box-shadow: inset 0 0 0 999px rgba(242, 181, 68, .3); } }
  /* Staffing */
  .stf { display: grid; gap: .6em; }
  .stc { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: .6em .8em; border-radius: .5em; background: var(--panel2); border-left: .35em solid var(--ok); }
  .stc.short { border-left-color: var(--err); }
  .stc.now { box-shadow: 0 0 0 2px var(--ok) inset; }
  .stc b { font-size: 1.15em; }
  .stc b .lo { display: block; font-size: .62em; font-weight: 600; color: var(--muted); }
  .stc .num { font-size: 2.2em; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stc .num small { font-size: .45em; color: var(--muted); }
  .stc .txt { grid-column: 1 / -1; color: var(--ok); font-weight: 600; }
  .stc.short .txt { color: var(--err); font-weight: 700; }
  /* Lists */
  .li { padding: .35em 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .li b { font-weight: 700; }
  .li .sub { color: var(--muted); font-size: .9em; }
  .day { margin: .5em 0 .2em; color: var(--gold); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-size: .9em; }
  .day:first-child { margin-top: 0; }
  .big { font-size: 4em; font-weight: 800; line-height: 1; }
  .bad { color: var(--err); }
  .offr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .6em; align-items: center; padding: .3em .4em; border-radius: .35em; background: var(--lv-bg); border-left: .3em solid var(--warn); margin-bottom: .3em; }
  .offr .cs { background: var(--blue); border-radius: .3em; text-align: center; font-weight: 800; min-width: 3.4em; }
  .offr .sub { color: var(--muted); font-size: .85em; white-space: nowrap; }
  /* Fleet */
  .fl-sum { display: flex; gap: 1.2em; margin-bottom: .5em; font-weight: 700; color: var(--muted); }
  .fl-sum b { font-size: 1.3em; }
  .fl { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.4em, 1fr)); gap: .45em; }
  .car { border-radius: .45em; padding: .3em .5em .35em; background: var(--panel2); border: 1px solid var(--line); min-width: 0; }
  .car .v { font-size: 1.5em; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .car .w { font-size: .78em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .car.use { background: var(--blue); border-color: #3C5D96; }
  .car.use .w { color: #DCE6F8; font-weight: 600; }
  .car.free { background: transparent; border-style: dashed; }
  .car.free .v { color: var(--muted); }
  .car.out { background: rgba(255, 107, 94, .2); border-color: var(--err); }
  .car.out .v { color: var(--err); }
  .car.out, .car.det { grid-column: span 2; }
  .car.det { background: #9C7A22; border-color: #9C7A22; } .car.det .v { color: #fff; } .car.det .w { color: #FFF4D6; font-weight: 600; }
  .car .w { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .car.out .w { color: #FFD3CE; font-weight: 600; }
  /* Change feed */
  .fd { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: .1em .7em; padding: .35em 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .fd .t { color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
  .fd .x { min-width: 0; }
  .fd .x .sub { color: var(--muted); font-size: .9em; }
  .fd .ar { color: var(--muted); margin: 0 .3em; }
  .fd .nw { color: var(--ink); font-weight: 700; }
  /* Readiness */
  .rd-top { display: flex; align-items: baseline; gap: .5em; margin-bottom: .5em; }
  .rd { padding: .35em 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .rd .h { display: flex; justify-content: space-between; gap: 1em; font-weight: 700; }
  .rd .h span { font-variant-numeric: tabular-nums; }
  .bar { height: .55em; border-radius: .3em; background: rgba(255,255,255,.1); overflow: hidden; margin: .25em 0; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .bar.mid i { background: var(--warn); } .bar.low i { background: var(--err); }
  .rd .sub { color: var(--muted); font-size: .85em; }
  /* Message and clock tiles */
  .msg { font-size: 1.9em; font-weight: 700; line-height: 1.25; white-space: pre-wrap; }
  .bigclock { text-align: center; padding-top: .4em; }
  .bigclock .t { font-size: 5.5em; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .bigclock .d { font-size: 1.5em; color: var(--muted); margin-top: .3em; }
  .bigclock .w { font-size: 1.5em; margin-top: .8em; }
  /* Ticker */
  .tick { background: var(--gold); color: #1B1405; font-weight: 800; font-size: 1.3em; white-space: nowrap; overflow: hidden; padding: .35em 0; }
  .tick span { display: inline-block; padding-left: 100%; animation: tick linear infinite; }
  @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  /* Urgent alert: takes over the screen */
  .urg { position: fixed; inset: 0; z-index: 10; display: grid; grid-template-rows: auto 1fr auto; background: #5E0F0B; color: #fff; border: 1.2em solid #FF3B2F; animation: urg 1.6s ease-in-out infinite; }
  .urg.amber { background: #4A3300; border-color: #F2B544; animation-name: urga; }
  @keyframes urg { 50% { border-color: #8E1B14; } }
  @keyframes urga { 50% { border-color: #7A5A10; } }
  .urg .top { display: flex; justify-content: space-between; align-items: center; padding: .8em 1.4em; font-weight: 800; letter-spacing: .2em; font-size: 1.6em; }
  .urg .txt { display: grid; place-items: center; text-align: center; padding: 0 1em; font-size: clamp(28px, 5.2vw, 160px); font-weight: 800; line-height: 1.15; white-space: pre-wrap; }
  .urg .ft { padding: .8em 1.4em; font-size: 1.2em; opacity: .85; display: flex; justify-content: space-between; }
  /* Status */
  .status { position: fixed; right: .8em; bottom: .6em; font-size: .8em; color: var(--muted); background: rgba(11,20,38,.85); padding: .2em .6em; border-radius: .4em; z-index: 5; }
  .status.warn { color: var(--warn); }
  .stop { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 2em; }
  .stop h1 { font-size: 2.4em; margin: 0 0 .4em; }
  .stop p { color: var(--muted); font-size: 1.3em; max-width: 40em; }
  /* A phone or a tablet held upright: one column that scrolls. */
  @media (max-aspect-ratio: 1/1) {
    html, body { overflow: auto; height: auto; }
    body { font-size: clamp(13px, 3.4vw, 22px); cursor: auto; }
    .screen { position: static; display: block; }
    .hd { gap: .7em; padding: .6em .8em; }
    .hd img { height: 2.6em; width: 2.6em; }
    .hd .bname { font-size: 1.35em; }
    .hd .clock { font-size: 1.7em; }
    .hd .date { font-size: .85em; }
    .ban { grid-template-columns: repeat(2, 1fr); }
    .body { display: block; }
    .body > .tile { margin-bottom: .8em; }
    .tile .in { overflow: visible; }
    .shifts { grid-template-columns: 1fr; }
    .tick { position: sticky; bottom: 0; }
    /* Each person on two lines: call sign, name and hours, then car, patrol, duty and break. */
    .ph { display: none; }
    .pr { grid-template-columns: 3.6em minmax(0, 1fr) auto; grid-template-areas: "cs who hr" "cs meta meta"; row-gap: .1em; align-items: center; }
    .pr > .cs { grid-area: cs; align-self: start; margin: .1em .6em 0 0; }
    .pr > .who { grid-area: who; } .pr > .hr { grid-area: hr; text-align: right; padding-right: 0; }
    .pr > .cr, .pr > .pat, .pr > .duty, .pr > .brk { display: none !important; }
    .pr > .meta { grid-area: meta; display: flex; flex-wrap: wrap; gap: .15em .9em; font-size: .88em; color: var(--muted); }
    .pr .meta b { color: var(--ink); font-weight: 600; }
    .pr .meta i { font-style: normal; opacity: .8; }
    .pr .hr .lv { white-space: nowrap; }
    .pr.st-part { background: linear-gradient(180deg, var(--lv-bg) 0 100%); }
    .pr .rk { display: none; }
    .status { left: 0; right: 0; bottom: 0; border-radius: 0; text-align: center; }
  }
  .meta { display: none; }
  /* ===================== Dress Blues: light (the look for bright rooms) ===================== */
  body.t-blues {

    // in case GitHub is still handing out the old copy).
    if (payload.page && payload.page !== PAGE_VERSION && !PREVIEW) {
      var last = +(store.get('oid-reload-at') || 0);
      // A new address each time, so phones (and home-screen icons) can't hand back their saved copy.
      if (q.get('v') !== payload.page || Date.now() - last > 10 * 60000) { store.set('oid-reload-at', String(Date.now())); freshLoad(payload.page); return; }
    }
    var first = !st.data;
    st.data = payload;
    var now = Date.now();
    (payload.boards || []).forEach(function (b, bi) {
      (b.board.tiles || []).forEach(function (t, ti) {
        var k = bi + ':' + ti, sigs = {};
        (t.shifts || []).forEach(function (s) { s.rows.forEach(function (x) { sigs[s.key + '|' + rowSig(x)] = 1; }); });
        (t.rows || []).forEach(function (x) { sigs[JSON.stringify(x)] = 1; });
        (t.cars || []).forEach(function (x) { sigs[JSON.stringify(x)] = 1; });
        (t.divs || []).forEach(function (d) { d.rows.forEach(function (x) { sigs[dwSig(d, x)] = 1; }); });
        (t.type === 'feed' ? t.list || [] : []).forEach(function (x) { sigs[JSON.stringify(x)] = 1; });
        if (!first && st.prev[k]) Object.keys(sigs).forEach(function (sg) { if (!st.prev[k][sg]) st.changed[k + '|' + sg] = now; });
        st.prev[k] = sigs;
      });
    });
    if (st.board >= (payload.boards || []).length) st.board = 0;
    render();
    showStatus();
  }
  function dwSig(d, x) { return 'dw|' + d.name + '|' + x.n + '|' + x.st + '|' + (x.h || '') + '|' + (x.why || '') + '|' + (x.part || ''); }
  function isNew(bi, ti, sg) { var t = st.changed[bi + ':' + ti + '|' + sg]; return t && Date.now() - t < 2 * 60000; }

  // ---------- Drawing ----------
  // Light or dark, picked for each TV in Admin > Displays. Auto: dark from 7 PM to 7 AM.
  function applyTheme() {
    var mode = (st.data && st.data.theme) || 'light', h = new Date().getHours();
    document.body.classList.toggle('dark', mode === 'dark' || (mode === 'auto' && (h >= 19 || h < 7)));
  }
  function render() {
    applyTheme();
    var d = st.data;
    var urgent = d && d.alert && (!d.alert.until || d.alert.until > Date.now()) ? d.alert : null;
    if (urgent) { renderUrgent(urgent); return; }
    if (!d || !(d.boards || []).length) { stop('Display', 'No boards are picked for this display yet.'); return; }
    var bi = st.board, item = d.boards[bi], b = item.board, now = new Date();
    var layout = { one: 1, two: 2, three: 3, four: 4, side: 2 }[b.layout] ? b.layout : 'one';
    var msgs = b.msgs || d.messages || [];   // the messages picked for this board
    app.innerHTML = '<div class="screen">' +
      '<div class="hd"><img src="' + PATCH + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
        '<div style="min-width:0"><div class="dept">' + esc(DEPT) + '</div><div class="bname">' + esc(b.name) + '</div></div>' +
        '<div class="right"><button type="button" class="rl" id="rl" aria-label="Reload">↻</button><div class="clock" id="clk">' + hm(now) + '</div><div class="date">' + esc(longDate(now)) + '</div>' +
          '<div class="wx" id="wx">' + wxText() + '</div></div></div>' +
      '<div>' + shortHtml(b.short) + '<div id="wxa">' + wxAlertHtml() + '</div></div>' +
      (b.banner ? bannerHtml(b.banner, list({ s: b.bshow }, 's', ['pat', 'sup', 'staff', 'off', 'cars', 'det', 'ov'])) : '<div></div>') +
      '<div class="body l-' + layout + '">' + b.tiles.map(function (t, ti) { return tileHtml(t, bi, ti); }).join('') + '</div>' +
      (b.ticker && msgs.length ? '<div class="tick"><span id="tick">' + msgs.map(esc).join('   •   ') + '</span></div>' : '<div></div>') +
      '</div>';
    var rl = document.getElementById('rl');
    if (rl) rl.onclick = function () { freshLoad(); };
    var tk = document.getElementById('tick');
    if (tk) tk.style.animationDuration = Math.max(15, tk.textContent.length * 0.25) + 's';
    startScrolls();
  }

  // An urgent alert from Admin > Displays: the whole screen, until it's cleared.
  function renderUrgent(a) {
    var at = new Date(a.at || Date.now());
    app.innerHTML = '<div class="urg' + (a.level === 'amber' ? ' amber' : '') + '">' +
      '<div class="top"><span>' + (a.level === 'amber' ? 'ATTENTION' : 'URGENT') + '</span><span id="clk">' + hm(new Date()) + '</span></div>' +
      '<div class="txt">' + esc(a.text) + '</div>' +
      '<div class="ft"><span>' + esc(DEPT) + '</span><span>Sent ' + esc(ampm(at)) + (a.until ? ' · until ' + esc(ampm(new Date(a.until))) : '') + '</span></div></div>';
  }

  // "Need 1 between 23:30 and 01:30; Need 2 between ..." -> "Short 1 · 2330–0130 (+1 more)"
  function shortStaff(t) {
    t = String(t || '');
    var gaps = t.match(/need\s+(\d+)\s+between\s+(\d{1,2}):?(\d{2})\s+and\s+(\d{1,2}):?(\d{2})/ig) || [];
    if (!gaps.length) return t.replace(/^minimum met\s*/i, 'Minimum met ').replace(/\((\d{2}):(\d{2})-(\d{2}):(\d{2})\)/, '$1$2–$3$4');
    var m = gaps[0].match(/need\s+(\d+)\s+between\s+(\d{1,2}):?(\d{2})\s+and\s+(\d{1,2}):?(\d{2})/i);
    return 'Short ' + m[1] + ' · ' + ('0' + m[2]).slice(-2) + m[3] + '–' + ('0' + m[4]).slice(-2) + m[5] + (gaps.length > 1 ? ' (+' + (gaps.length - 1) + ' more)' : '');
  }

  // Short-staffed warning across the top (a board option): the shift working now.
  function shortHtml(x) {
    if (!x || !x.text) return '';
    var t = shortStaff(x.text);
    return '<div class="sst"><b>Short-staffed' + (x.shift ? ' · ' + esc(x.shift) : '') + '</b><span>' + esc(t || x.text) + '</span></div>';
  }

  // "Right now" numbers across the top.
  function bannerHtml(n, show) {
    show = show || ['pat', 'sup', 'staff', 'off', 'cars', 'det', 'ov'];
    var on = function (k) { return show.indexOf(k) >= 0; };
    if (!show.length) return '<div></div>';
    var shift = SHIFT_NAMES[n.shift] || '';
    var low = n.pat < n.min;
    var staffBad = /not\s*met|below|short|under|need|hire/i.test(n.staffing || '');
    var box = function (cls, k, v, s) { return '<div class="bx ' + cls + '"><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div><div class="s">' + esc(s || ' ') + '</div></div>'; };
    return '<div class="ban">' +
      (on('pat') ? box(low ? 'bad' : 'good', 'Patrol on now', n.pat + '<small>of ' + n.min + ' min</small>', shift + (n.squad ? ' · ' + n.squad : '')) : '') +
      (on('sup') ? box('', 'Supervisors on', n.sup, shift) : '') +
      (on('staff') ? box(staffBad ? 'bad' : n.staffing ? 'good' : '', 'Staffing', staffBad ? 'Short' : n.staffing ? 'Met' : '–', shortStaff(n.staffing) || 'No staffing line yet') : '') +
      (on('off') ? box(n.off ? 'mid' : '', 'Out today', n.off, 'Sick, vacation and other leave') : '') +
      (on('cars') ? box(n.carsOut ? 'bad' : 'good', 'Cruisers down', n.carsOut, n.carsOut ? 'Out of service' : 'All in service') : '') +
      (on('det') && n.det ? box(n.det.length ? 'det' : '', 'On a detail', n.det.length, n.det.length ? 'Cruiser ' + n.det.join(', ') : 'None now') : '') +
      (n.overlaps == null || !on('ov') ? '' : box(n.overlaps ? 'bad' : 'good', 'Overlaps', n.overlaps, n.overlaps ? 'Waiting for review' : 'None waiting')) +
      '</div>';
  }

  // The duty sheet's card rules: red = overtime (holdovers too), yellow =
  // leave; part of the shift on leave shows both, in time order.
  function hhmmMins(t) {
    var n = parseInt(t, 10);
    if (isNaN(n)) return null;
    var v = Math.floor(n / 100) * 60 + n % 100;
    return n < 730 ? v + 1440 : v;
  }
  function cardStatus(x) {
    var leave = null;
    (x.dts || []).some(function (n) {
      var m = String(n).match(/^(.*?)\s*(\d{4})-(\d{4})$/);
      if (!m) return false;
      leave = { label: m[1].trim() || 'Leave', from: m[2], to: m[3], text: String(n) };
      return true;
    });
    var ot = x.ot || (x.t === 'ot' || /^ot$/i.test(String(x.d || '').trim()) ? 'OT' : '');
    if (x.a) {
      var why = leave ? leave.label : ((x.dts || [])[0] || (x.d && !/^(p|a|ot)$/i.test(x.d) ? x.d : 'Absent'));
      return { cls: 'st-leave', pill: why, pillCls: 'lv', used: leave };
    }
    if (leave) {
      var hmm = String(x.h || '').match(/^(\d{4})-(\d{4})$/);
      var before = hmm ? hhmmMins(leave.to) <= hhmmMins(hmm[1]) : true;
      return { cls: 'st-part' + (ot ? ' st-part-ot' : ''), pill: ot, pillCls: 'ot', leave: leave, before: before, used: leave };
    }
    if (ot) return { cls: 'st-ot', pill: ot, pillCls: 'ot' };
    return { cls: '', pill: '', pillCls: '' };
  }
  function staffCls(text) { return /not\s*met|below|short|under|need|hire/i.test(text) ? 'bad' : /met|full/i.test(text) ? 'ok' : ''; }
  // Duty P (patrol) is everyone's usual, so the column shows only the others (FTO, Desk...).
  // Like the duty sheet: Supervisors (on their own tour or supervisor coverage), Patrol
  // (a sergeant on patrol overtime sits here), Overtime, then anyone off. Each group by call sign.
  function byCall(a, b) {
    return String(a.cs || '~').localeCompare(String(b.cs || '~'), undefined, { numeric: true }) || String(a.n).localeCompare(String(b.n));
  }
  function orderRows(rows, how) {
    if (how === 'sheet') return rows;
    var groups = [['Supervisors', function (x) { return !x.a && x.t === 'sup'; }], ['Patrol', function (x) { return !x.a && x.t !== 'sup' && x.t !== 'ot'; }],
      ['Overtime', function (x) { return !x.a && x.t === 'ot'; }], ['Off', function (x) { return x.a; }]];
    var out = [];
    groups.forEach(function (g) {
      var L = rows.filter(g[1]);
      if (how !== 'groupsheet') L = L.slice().sort(byCall);
      if (!L.length) return;
      out.push({ grp: g[0], n: L.length });
      out = out.concat(L);
    });
    return out;
  }
  // The same class on several days shows once, with its dates listed
  // ("Mon 10/19, Thu 10/22, Fri 10/23") and one list of who still needs it.
  function combineDates(rows) {
    var out = [], by = {};
    rows.forEach(function (x) {
      var k = x.kind + '|' + String(x.title).toLowerCase().trim();
      var g = by[k];
      if (!g) {
        g = by[k] = { title: x.title, kind: x.kind, other: x.other, cat: x.cat, date: x.date, dates: [], starts: {}, wheres: {}, n: 0, seats: 0, ppl: null };
        out.push(g);
      }
      if (g.dates.indexOf(x.date) < 0) g.dates.push(x.date);
      g.starts[times(x)] = 1; g.wheres[x.where || ''] = 1;
      g.n += x.n || 0; g.seats += x.seats || 0;
      if (x.ppl) {
        g.ppl = g.ppl || {};
        Object.keys(x.ppl).forEach(function (role) {
          var L = g.ppl[role] = g.ppl[role] || [];
          x.ppl[role].forEach(function (p) {
            if (!L.some(function (q) { return q.n === p.n && q.c === p.c; })) L.push(p);
          });
        });
      }
    });
    out.forEach(function (g) {
      var st = Object.keys(g.starts), wh = Object.keys(g.wheres);
      g.start = st.length === 1 ? st[0] : ''; g.end = '';   // the time shows only when every day has the same one
      g.where = wh.length === 1 ? wh[0] : '';
      delete g.starts; delete g.wheres;
    });
    return out;
  }
  function dutyText(d) { d = filled(d); return /^(p|patrol|a|ot)$/i.test(d) ? '' : d; }
  // "----" or "--" on the sheet means nothing there.
  function filled(v) { v = String(v == null ? '' : v).trim(); return /^[-–—_.\s]*$/.test(v) ? '' : v; }
  function personRow(x, cls, cols) {
    cols = cols || [];
    var s = cardStatus(x);
    var hours = esc(x.h || '');
    if (s.leave) {
      var lv = '<span class="lv">' + esc(s.leave.label + ' ' + s.leave.from + '-' + s.leave.to) + '</span>';
      hours = s.before ? lv + esc(x.h || '') : esc(x.h || '') + lv;
    }
    var tags = (s.pill && cols.indexOf('labels') >= 0 ? '<span class="pill ' + s.pillCls + '">' + esc(s.pill) + '</span>' : '') +
      (cols.indexOf('tags') >= 0 ? (x.ct ? '<span class="pill tag">' + esc(x.ct) + '</span>' : '') +
        (x.tmp ? '<span class="pill tag">Temporary</span>' : '') +
        (x.drp ? '<span class="pill tag">Dropped in DTS</span>' : '') : '') +
      (x.up && !x.on && !x.a && cols.indexOf('dot') >= 0 ? '<span class="pill up">Coming in ' + esc(String(x.h || '').slice(0, 4)) + '</span>' : '');
    return '<div class="pr ' + esc(x.t) + ' ' + s.cls + (x.on ? ' on' : '') + (x.up && !x.on ? ' up' : '') + (cls || '') + '">' +
      '<span class="cs">' + esc(x.cs || '·') + '</span>' +
      '<span class="who"><span class="nm">' + esc(x.n) + '</span>' + (x.r ? '<span class="rk">' + esc(x.r) + '</span>' : '') + tags + '</span>' +
      '<span class="hr">' + hours + '</span>' +
      '<span class="cr">' + esc(x.a ? '' : filled(x.u)) + '</span>' +
      '<span class="pat">' + esc(x.a ? '' : filled(x.p)) + '</span>' +
      '<span class="duty">' + esc(x.a ? '' : dutyText(x.d)) + '</span>' +
      '<span class="brk">' + esc(x.a ? '' : filled(x.b)) + '</span>' +
      metaLine(x, cols) + '</div>';
  }
  // On a phone held upright the columns don't fit, so car, patrol, duty and break
  // go on a second line under the name (only the ones ticked for the panel).
  function metaLine(x, cols) {
    if (x.a) return '';
    var on = function (c) { return cols.indexOf(c) >= 0; };
    var bits = [];
    if (on('cr') && filled(x.u)) bits.push('<span><i>Car</i> ' + esc(filled(x.u)) + '</span>');
    if (on('pat') && filled(x.p)) bits.push('<span><b>' + esc(filled(x.p)) + '</b></span>');
    if (on('duty') && dutyText(x.d)) bits.push('<span>' + esc(dutyText(x.d)) + '</span>');
    if (on('brk') && filled(x.b)) bits.push('<span><i>Break</i> ' + esc(filled(x.b)) + '</span>');
    return bits.length ? '<span class="meta">' + bits.join('') + '</span>' : '';
  }

  function tileHtml(t, bi, ti) {
    var titles = { onduty: "Who's working", staffing: 'Staffing', off: 'Off today', cruisers: 'Cruisers', training: 'Upcoming training',
      overlaps: 'Overlaps to review', message: 'Notice', clock: '', feed: 'Latest changes', ready: 'Training readiness', oncall: 'On call', court: 'Court', holdover: 'Holdover list', events: 'Calendar', divwork: 'Divisions at work', tasks: 'Tasks' };
    var title = t.title || (t.type === 'events' && t.calName) || titles[t.type] || '';
    var sub = t.squad && /^(onduty|staffing|off|holdover)$/.test(t.type) ? t.squad : '';
    var inner = '', o = t.o || {};
    if (t.type === 'onduty') {
      var cols = list(o, 'cols', ['cs', 'rank', 'hr', 'cr', 'pat', 'duty', 'brk', 'labels', 'tags', 'dot']);
      var head = list(o, 'head', ['staff', 'count', 'cols']);
      var off = ['cs', 'rank', 'hr', 'cr', 'pat', 'duty', 'brk', 'dot'].filter(function (c) { return cols.indexOf(c) < 0; }).map(function (c) { return ' no-' + c; }).join('');
      inner = t.empty ? '<p class="empty">' + esc(t.empty) + '</p>' : '<div class="shifts' + off + '">' + (t.shifts || []).map(function (s) {
        return '<div class="shift' + (s.key === t.now ? ' now' : '') + '">' +
          '<h3><span class="nm">' + esc(SHIFT_NAMES[s.key] || s.label) + '</span>' + (head.indexOf('count') >= 0 ? '<span class="cnt">' + s.present + ' present' + (s.absent ? ' · ' + s.absent + ' off' : '') + '</span>' : '') + '</h3>' +
          (s.staffing && head.indexOf('staff') >= 0 ? '<div class="stl ' + staffCls(s.staffing) + '">' + esc(s.staffing) + '</div>' : '') +
          (s.rows.length ? (head.indexOf('cols') >= 0 ? '<div class="ph"><span class="cs">Call</span><span>Name</span><span class="hr">Hours</span><span class="cr">Car</span><span class="pat">Patrol</span><span class="duty">Duty</span><span class="brk">Break</span></div>' : '') +
            orderRows(s.rows, o.order).map(function (x) {
              return x.grp ? '<div class="pg">' + esc(x.grp) + ' <span>' + x.n + '</span></div>' : personRow(x, isNew(bi, ti, s.key + '|' + rowSig(x)) ? ' chg' : '', cols);
            }).join('')
            : '<p class="empty">No one listed</p>') + '</div>';
      }).join('') + '</div>';
    } else if (t.type === 'staffing') {
      inner = '<div class="stf">' + (t.lines || []).map(function (l) {
        var sw = list(o, 'show', ['min', 'ot', 'text']);
        var txt = [sw.indexOf('text') >= 0 ? l.text || (l.on + ' on the roster') : '', l.ot && sw.indexOf('ot') >= 0 ? l.ot + ' on overtime' : ''].filter(Boolean).join(' · ');
        return '<div class="stc' + (l.short ? ' short' : '') + (l.key === t.now ? ' now' : '') + '"><b>' + esc(l.name) + '<small class="lo">fewest on at once' + (l.short && l.at ? ', at ' + esc(l.at) : '') + '</small></b>' +
          '<span class="num">' + l.on + (l.min && sw.indexOf('min') >= 0 ? '<small> / ' + l.min + ' min</small>' : '') + '</span>' +
          (txt ? '<span class="txt">' + esc(txt) + '</span>' : '') + '</div>';
      }).join('') + '</div>';
    } else if (t.type === 'off') {
      inner = (t.rows || []).length ? (t.rows || []).map(function (x) {
        var oc = list(o, 'cols', ['cs', 'why', 'shift']);
        return '<div class="offr' + (isNew(bi, ti, JSON.stringify(x)) ? ' chg' : '') + '">' + (oc.indexOf('cs') >= 0 ? '<span class="cs">' + esc(x.cs || '·') + '</span>' : '<span></span>') +
          '<span><b>' + esc(x.n) + '</b> ' + (oc.indexOf('shift') >= 0 ? '<span class="sub">' + esc(x.shift) + '</span>' : '') + '</span>' +
          (oc.indexOf('why') >= 0 ? '<span class="pill lv">' + esc(x.why) + '</span>' : '<span></span>') + '</div>';
      }).join('') : '<p class="empty">No one marked off.</p>';
    } else if (t.type === 'cruisers') {
      var c = t.counts || {};
      sub = t.shift ? 'Now: ' + t.shift : '';
      var cshow = list(o, 'show', ['sum', 'out', 'use', 'free', 'why']);
      var cwho = o.who || 'cs';
      var cars = (t.cars || []).filter(function (x) { return cshow.indexOf(x.s === 'det' ? 'use' : x.s) >= 0; });
      inner = cars.length ? (cshow.indexOf('sum') >= 0 ? '<div class="fl-sum"><span><b class="bad">' + (c.out || 0) + '</b> down</span><span><b>' + (c.use || 0) + '</b> in use</span>' +
        (c.det ? '<span><b>' + c.det + '</b> on detail</span>' : '') + '<span><b>' + (c.free || 0) + '</b> free</span></div>' : '') +
        '<div class="fl">' + cars.map(function (x) {
          var w = x.s === 'det' ? 'Detail · ' + (cwho === 'name' ? x.det.n : cwho === 'both' ? [x.det.cs, x.det.n].filter(Boolean).join(' ') : x.det.cs || x.det.n) + (x.det.to ? ' til ' + x.det.to : '')
            : x.s === 'out' ? (cshow.indexOf('why') >= 0 ? x.why || 'Out of service' : 'Out of service') : x.s === 'use' ? x.who.map(function (p) {
            return cwho === 'name' ? p.n : cwho === 'both' ? [p.cs, p.n].filter(Boolean).join(' ') : p.cs || p.n; }).join(', ') : 'Free';
          return '<div class="car ' + x.s + (isNew(bi, ti, JSON.stringify(x)) ? ' chg' : '') + '"><div class="v">' + esc(x.v) + '</div><div class="w">' + esc(w) + '</div></div>';
        }).join('') + '</div>' : '<p class="empty">No cruisers listed on the roster.</p>';
    } else if (t.type === 'training') {
      var last = '', combine = o.group !== 'each';
      var trows = combine ? combineDates(t.rows || []) : (t.rows || []);
      inner = trows.length ? trows.map(function (x) {
        var head = !combine && x.date !== last ? '<div class="day">' + esc(dayLabel(x.date)) + '</div>' : '';
        last = x.date;
        var info = list(o, 'info', ['time', 'where', 'count']);
        var count = x.kind === 'class' ? x.n + ' of ' + x.seats + ' signed up' : x.n ? x.n + ' signed in' : '';
        var sub = [combine ? x.dates.map(dayLabel).join(', ') : '', info.indexOf('time') >= 0 ? times(x) : '', info.indexOf('where') >= 0 ? x.where : '', info.indexOf('count') >= 0 ? count : ''].filter(Boolean).join(' · ');
        var groups = [['instructor', 'Instructors'], ['officer', x.kind === 'class' ? 'Signed up' : 'Attendees'], ['roleplayer', 'Role players'], ['other', x.other || 'Other'], ['missing', 'Still needs it']];
        var ppl = x.ppl ? groups.map(function (g) {
          var L = x.ppl[g[0]];
          if (!L || !L.length) return '';
          return '<div class="ppl' + (g[0] === 'missing' ? ' miss' : '') + '"><b>' + esc(g[1]) + ' (' + L.length + ')</b>' + L.map(function (p) {
            return '<span class="chip' + (p.s === 'never' ? ' never' : '') + '">' + (p.c ? '<i>' + esc(p.c) + '</i>' : '') + esc(p.n) + '</span>'; }).join('') + '</div>';
        }).join('') : '';
        return head + '<div class="li"><b>' + esc(x.title) + '</b>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + ppl + '</div>';
      }).join('') : '<p class="empty">No training scheduled.</p>';
    } else if (t.type === 'overlaps') {
      inner = t.empty ? '<p class="empty">' + esc(t.empty) + '</p>' :
        '<div class="big' + (t.n ? ' bad' : '') + '">' + (t.n || 0) + '</div><div class="sub" style="margin:.2em 0 .6em">' + (t.n === 1 ? 'overlap needs a look' : 'overlaps need a look') + '</div>' +
        (o.list === 'no' ? '' : (t.list || []).map(function (x) { return '<div class="li"><b>' + esc(x.who) + '</b><div class="sub">' + esc([x.what, x.when].filter(Boolean).join(' · ')) + '</div></div>'; }).join(''));
    } else if (t.type === 'message') {
      var ml = t.list || [];
      inner = ml.length ? '<div class="msg" data-rot="' + ml.length + '">' + ml.map(function (m, i) { return '<div' + (i ? ' hidden' : '') + '>' + esc(m) + '</div>'; }).join('') + '</div>'
        : '<p class="empty">No notices right now.</p>';
    } else if (t.type === 'feed') {
      inner = (t.list || []).length ? t.list.map(function (x) {
        var who = [x.cs, x.n].filter(Boolean).join(' ');
        var what = x.was && x.now ? '<span>' + esc(x.was) + '</span><span class="ar">→</span><span class="nw">' + esc(x.now) + '</span>'
          : x.now ? '<span class="nw">' + esc(x.now) + '</span>' : x.was ? '<span>' + esc(x.was) + '</span><span class="ar">→</span><span class="nw">cleared</span>' : '';
        return '<div class="fd' + (isNew(bi, ti, JSON.stringify(x)) ? ' chg' : '') + '"><span class="t">' + esc(x.t) + '</span><div class="x"><b>' + esc(who) + '</b>' +
          '<div class="sub">' + esc(x.f) + (what ? ': ' : '') + what + (x.sh && o.shift !== 'no' ? ' · ' + esc(SHIFT_NAMES[x.sh] || x.sh) : '') + '</div></div></div>';
      }).join('') : '<p class="empty">No changes in the last ' + (t.hours || 12) + ' hours.</p>';
    } else if (t.type === 'ready') {
      inner = t.empty ? '<p class="empty">' + esc(t.empty) + '</p>' :
        '<div class="rd-top"><span class="big' + (t.missing ? ' bad' : '') + '" style="font-size:2.6em">' + (t.missing || 0) + '</span><span class="sub">of ' + (t.people || 0) + ' people are missing a required training</span></div>' +
        (t.list || []).map(function (r) {
          var pct = r.total ? Math.round(r.done / r.total * 100) : 0;
          var rs = list(o, 'show', ['bar', 'counts', 'next']);
          var rest = [rs.indexOf('counts') >= 0 && r.never ? r.never + ' never' : '', rs.indexOf('counts') >= 0 && r.overdue ? r.overdue + ' overdue' : '',
            rs.indexOf('counts') >= 0 && r.signed ? r.signed + ' signed up' : '', rs.indexOf('next') >= 0 && r.next ? 'next ' + dayLabel(r.next) : ''].filter(Boolean).join(' · ');
          var names = r.who && r.who.length ? '<div class="ppl miss">' + r.who.map(function (p) {
            return '<span class="chip' + (p.s === 'never' ? ' never' : '') + '">' + (p.c ? '<i>' + esc(p.c) + '</i>' : '') + esc(p.n) + (p.s === 'signed' ? ' ✓' : '') + '</span>'; }).join('') + '</div>' : '';
          return '<div class="rd"><div class="h"><span>' + esc(r.name) + '</span><span>' + r.done + '/' + r.total + ' · ' + pct + '%</span></div>' +
            (rs.indexOf('bar') >= 0 ? '<div class="bar ' + (pct < 70 ? 'low' : pct < 90 ? 'mid' : '') + '"><i style="width:' + pct + '%"></i></div>' : '') +
            (rest ? '<div class="sub">' + esc(rest) + '</div>' : '') + names + '</div>';
        }).join('');
    } else if (t.type === 'oncall') {
      var osw = list(o, 'show', ['cover', 'times']);
      var odays = t.days || [];
      inner = t.empty ? '<p class="empty">' + esc(t.empty) + '</p>' : odays.map(function (d, i) {
        var head = odays.length > 1 || d.head ? '<div class="day">' + esc(d.head || dayLabel(d.date)) + '</div>' : '';
        var ppl = d.people.length ? d.people.map(function (p) {
          return '<div class="oc' + (i === 0 && !t.skipToday && p.now ? ' now' : '') + (p.cover && osw.indexOf('cover') >= 0 ? ' cov' : '') + '">' + (p.cs ? '<span class="oc-cs">' + esc(p.cs) + '</span>' : '') + '<span class="oc-n">' + esc(p.n) + '</span>' +
            (p.cover && osw.indexOf('cover') >= 0 ? '<span class="oc-c"><b>Covering for</b>' + (p.coverCs ? '<span class="oc-ccs">' + esc(p.coverCs) + '</span>' : '') + esc(p.cover) + '</span>' : '') +
            (p.time && osw.indexOf('times') >= 0 ? '<span class="oc-t">' + esc(p.time) + '</span>' : '') + '</div>';
        }).join('') : '<p class="empty oc-none">No one listed</p>';
        var isToday = i === 0 && !t.skipToday;
        return '<div class="oc-day' + (isToday ? ' today' : '') + (odays.length === 1 && isToday ? ' only' : '') + '">' + head + ppl + '</div>';
      }).join('');
    } else if (t.type === 'events') {
      // A shared calendar's events, by day.
      var esw = list(o, 'show', ['time']), edays = t.days || [];
      inner = t.empty ? '<p class="empty">' + esc(t.empty) + '</p>' : edays.map(function (d) {
        var isToday = d.date === t.today;
        var evs = d.events.length ? d.events.map(function (e) {
          return '<div class="oc' + (isToday && e.now ? ' now' : '') + '"><span class="oc-n">' + esc(e.t) + '</span>' +
            (e.time && esw.indexOf('time') >= 0 ? '<span class="oc-t">' + esc(e.time) + '</span>' : '') + '</div>';
        }).join('') : '<p class="empty oc-none">Nothing scheduled</p>';
        return '<div class="oc-day' + (isToday ? ' today' : '') + (edays.length === 1 && isToday ? ' only' : '') + '"><div class="day">' + esc(isToday ? 'Today' : dayLabel(d.date)) + '</div>' + evs + '</div>';
      }).join('') || '<p class="empty">Nothing on the calendar.</p>';
    } else if (t.type === 'tasks') {
      // Admin tasks: overdue in red, then by due date; done ones wait for a supervisor to confirm.
      var tc = t.counts || {}, trs = t.rows || [];
      var tdue = function (x) {
        if (x.st === 'done') return 'Done' + (x.by ? ' · ' + x.by : '');
        var dd = Math.round((new Date(x.due + 'T12:00:00') - new Date(t.today + 'T12:00:00')) / 86400000);
        return (dd < 0 ? (-dd) + (dd === -1 ? ' day' : ' days') + ' late' : dd === 0 ? 'Today' : dd === 1 ? 'Tomorrow' : dayLabel(x.due)) + (x.time && dd >= 0 ? ' ' + x.time : '');
      };
      inner = t.empty ? '<p class="empty">' + esc(t.empty) + '</p>' :
        '<div class="tk-sum">' + (tc.late ? '<span class="bad"><b>' + tc.late + '</b>overdue</span>' : '') + '<span><b>' + (tc.open || 0) + '</b>to do</span>' +
          (tc.done ? '<span class="ok"><b>' + tc.done + '</b>done, to confirm</span>' : '') + '</div>' +
        (trs.length ? trs.map(function (x) {
          var sub = [x.st === 'back' ? 'Sent back' : '', x.fn || '', x.notes || ''].filter(Boolean).join(' · ');
          return '<div class="tk ' + (x.st === 'done' ? 'done' : x.late ? 'late' : '') + (isNew(bi, ti, JSON.stringify(x)) ? ' chg' : '') + '"><span class="tk-bx">' + (x.st === 'done' ? '✓' : '') + '</span>' +
            '<span class="tk-t">' + esc(x.t) + '</span><span class="tk-d">' + esc(tdue(x)) + '</span>' + (sub ? '<span class="tk-s">' + esc(sub) + '</span>' : '') + '</div>';
        }).join('') : '<p class="empty">Nothing due. All caught up.</p>');
    } else if (t.type === 'divwork') {
      // Divisions at work: who in each division is working today, from DTS or their usual hours.
      var dcols = list(o, 'cols', ['cs', 'hr', 'dot', 'why']);
      var dcnt = o.count !== 'no';
      inner = t.empty ? '<p class="empty">' + esc(t.empty) + '</p>' : '<div class="' + (dcols.indexOf('dot') < 0 ? 'no-dot' : '') + '">' + (t.divs || []).map(function (d) {
        var head = '<div class="day">' + esc(d.name) + (dcnt ? '<span class="ct-n">' + (d.now ? d.now + ' in now · ' : '') + d.working + ' working today</span>' : '') + '</div>';
        var rows = d.rows.length ? d.rows.map(function (x) {
          var cls = x.st === 'work' ? (x.on ? 'on' : x.done ? 'done' : 'up') : x.st;
          var right = x.st === 'work' ? (dcols.indexOf('hr') >= 0 ? (x.done ? 'Done ' + String(x.h || '').slice(5) : x.up ? 'In at ' + String(x.h || '').slice(0, 4) : x.h) : (x.up ? 'Later' : x.done ? 'Done' : ''))
            : x.st === 'rest' ? 'Not working today' : x.st === 'none' ? 'No schedule' : '';
          var pills = (x.st === 'off' ? '<span class="pill lv">' + esc(dcols.indexOf('why') >= 0 ? x.why || 'Off' : 'Off') + '</span>' : '') +
            (x.st === 'work' && x.why && dcols.indexOf('why') >= 0 ? '<span class="pill tag">' + esc(x.why) + '</span>' : '') +
            (x.part && dcols.indexOf('why') >= 0 ? '<span class="pill lv">' + esc(x.part) + '</span>' : '');
          return '<div class="dw ' + cls + (isNew(bi, ti, dwSig(d, x)) ? ' chg' : '') + '">' +
            (x.cs && dcols.indexOf('cs') >= 0 ? '<span class="oc-cs">' + esc(x.cs) + '</span>' : '') +
            '<span class="dw-n">' + esc(x.n) + '</span>' + (x.r && dcols.indexOf('rank') >= 0 ? '<span class="dw-r">' + esc(x.r) + '</span>' : '') + pills +
            (right ? '<span class="dw-h">' + esc(right) + '</span>' : '') + '</div>';
        }).join('') : '<p class="empty oc-none">' + (o.only === 'now' ? 'No one in right now' : 'No one working today') + '</p>';
        return '<div class="dw-div">' + head + rows + '</div>';
      }).join('') + '</div>';
    } else if (t.type === 'court') {
      var cdays = t.days || [];
      inner = t.empty ? '<p class="empty">' + esc(t.empty) + '</p>' : !cdays.length ? '<p class="empty">No one is scheduled for court.</p>' : cdays.map(function (d) {
        // Officers on one case are listed together under its docket.
        var order = [], by = {};
        d.rows.forEach(function (r) { var k = r.docket || ''; if (!by[k]) { by[k] = []; order.push(k); } by[k].push(r); });
        return '<div class="ct-day' + (d.date === t.today ? ' today' : '') + '"><div class="day">' + esc(dayLabel(d.date)) + ' <span class="ct-n">' + d.rows.length + '</span></div>' +
          order.map(function (k) {
            var g = by[k], ada = String(g.map(function (r) { return r.ada; }).filter(Boolean)[0] || '').replace(/^\s*a\.?\s*d\.?\s*a\.?\s*[:\-]?\s*/i, ''), cc = g.map(function (r) { return r.cc; }).filter(Boolean)[0] || '';
            var head = [k ? '<span><b>Docket</b> ' + esc(k) + '</span>' : '', ada ? '<span><b>ADA</b> ' + esc(ada) + '</span>' : '', cc ? '<span><b>Case</b> ' + esc(cc) + '</span>' : ''].join('');
            return '<div class="ct-grp">' + (head ? '<div class="ct-h">' + head + '</div>' : '') + g.map(function (r) {
              return '<div class="ct">' + (r.cs ? '<span class="oc-cs">' + esc(r.cs) + '</span>' : '') + '<span class="ct-nm">' + esc(r.n) + '</span>' +
                (r.time ? '<span class="ct-t">' + esc(r.time) + '</span>' : '') + (r.note ? '<span class="ct-note">' + esc(r.note) + '</span>' : '') + '</div>';
            }).join('') + '</div>';
          }).join('') + '</div>';
      }).join('');
    } else if (t.type === 'holdover') {
      var hsecs = t.sections || [];
      inner = t.empty ? '<p class="empty">' + esc(t.empty) + '</p>' : hsecs.map(function (sec) {
        return '<div class="ho-sec' + (sec.key === t.now ? ' now' : '') + '">' + (hsecs.length > 1 || sec.key !== t.now ? '<div class="day">' + esc(SHIFT_NAMES[sec.key] || sec.title) + (sec.key === t.now ? ' · now' : '') + '</div>' : '') +
          (sec.rows.length ? sec.rows.map(function (r, i) {
            return '<div class="ho' + (r.off ? ' off' : '') + (i === 0 && !r.off ? ' first' : '') + '"><span class="ho-i">' + (i + 1) + '</span>' + (r.cs ? '<span class="oc-cs">' + esc(r.cs) + '</span>' : '') +
              '<span class="ho-n">' + esc(r.n) + (r.off ? ' <span class="pill lv">Off today</span>' : '') + '</span>' +
              '<span class="ho-m">' + (r.dlh ? '<span>' + (r.dlh === 'Never held' ? esc(r.dlh) : 'Held <b>' + esc(r.dlh) + '</b>') + (r.ago ? ' · ' + esc(r.ago) : '') + '</span>' : '') +
              (r.ph ? '<span class="ho-ph">' + esc(r.ph) + '</span>' : '') + '</span></div>';
          }).join('') + (sec.more ? '<div class="ho-more">+ ' + sec.more + ' more on the list</div>' : '') : '<p class="empty">No one listed</p>') + '</div>';
      }).join('');
    } else if (t.type === 'clock') {
      var n = new Date();
      var cl = list(o, 'show', ['date', 'wx']);
      inner = '<div class="bigclock"><div class="t" data-clk="1">' + hm(n) + '</div>' + (cl.indexOf('date') >= 0 ? '<div class="d">' + esc(longDate(n)) + '</div>' : '') +
        (cl.indexOf('wx') >= 0 ? '<div class="w" data-wx="1">' + wxText(true) + '</div>' : '') + '</div>';
    }
    var sz = { s: ' sz-s', l: ' sz-l', xl: ' sz-xl' }[(t.o || {}).size] || '';
    return '<section class="tile' + sz + '">' + (title ? '<h2>' + esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</h2>' : '') +
      '<div class="in"><div class="scroll">' + inner + '</div></div></section>';
  }

  // Lists too long for their panel scroll slowly down, pause, and come back up.
  var scrollers = [], pins = [], pinLoop = 0;
  // Court: the day's heading ("Today") stays at the top while its names
  // scroll under it, until the next day's heading pushes it off.
  function pinFrame() {
    pinLoop = 0;
    pins.forEach(function (p) {
      if (!p.box.isConnected) return;
      var m = getComputedStyle(p.inner).transform, y = 0;
      if (m && m !== 'none') { var v = m.match(/matrix.*\((.+)\)/); if (v) { var n = v[1].split(','); y = -parseFloat(n[n.length === 16 ? 13 : 5]) || 0; } }
      var cur = -1;
      for (var i = 0; i < p.tops.length; i++) if (p.tops[i] <= y + 0.5) cur = i;
      if (cur < 0 || y < 1) { p.el.style.visibility = 'hidden'; return; }
      if (p.shown !== cur) { p.el.innerHTML = p.heads[cur].innerHTML; p.shown = cur; }
      var push = 0, nxt = p.tops[cur + 1];
      if (nxt != null && nxt - y + p.pad < p.el.offsetHeight) push = nxt - y + p.pad - p.el.offsetHeight;
      p.el.style.transform = 'translateY(' + push + 'px)';
      p.el.style.visibility = 'visible';
    });
    if (pins.length) pinLoop = requestAnimationFrame(pinFrame);
  }
  function addPin(box, inner) {
    var heads = [].slice.call(inner.querySelectorAll('.ct-day > .day'));
    if (heads.length < 1) return;
    var cs = getComputedStyle(box), tile = box.closest('.tile');
    var el = document.createElement('div');
    el.className = 'day';
    el.setAttribute('aria-hidden', 'true');
    el.style.cssText = 'position:absolute;left:0;right:0;top:0;margin:0;z-index:2;visibility:hidden;pointer-events:none;' +
      'padding:' + cs.paddingTop + ' ' + cs.paddingRight + ' .3em ' + cs.paddingLeft + ';background:' + getComputedStyle(tile).backgroundColor;
    box.appendChild(el);
    var padTop = parseFloat(cs.paddingTop) || 0;
    // Where each heading sits in the list (the slide doesn't change these).
    var top0 = inner.getBoundingClientRect().top;
    var tops = heads.map(function (h) { return h.getBoundingClientRect().top - top0; });
    pins.push({ box: box, inner: inner, heads: heads, tops: tops, el: el, shown: -1, pad: padTop });
  }
  function startScrolls() {
    scrollers.forEach(function (s) { clearTimeout(s.t); });
    scrollers = [];
    pins.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    pins = [];
    if (pinLoop) { cancelAnimationFrame(pinLoop); pinLoop = 0; }
    if (portrait()) return;
    document.querySelectorAll('.tile .in').forEach(function (box) {
      var inner = box.firstChild, extra = inner.scrollHeight - box.clientHeight;
      if (extra <= 4) return;
      if (inner.querySelector('.ct-day > .day')) addPin(box, inner);
      var s = { t: 0 }, speed = 28; // pixels a second
      var go = function (down) {
        var dist = down ? extra : 0, secs = extra / speed;
        inner.style.transition = 'transform ' + secs + 's linear';
        inner.style.transform = 'translateY(' + (-dist) + 'px)';
        s.t = setTimeout(function () { go(!down); }, secs * 1000 + 5000);
      };
      s.t = setTimeout(function () { go(true); }, 6000);
      scrollers.push(s);
    });
    if (pins.length) pinLoop = requestAnimationFrame(pinFrame);
  }

  // ---------- Weather (National Weather Service) ----------
  function wxText(big) {
    var w = st.wx;
    if (!w) return '';
    return esc(w.temp + '°' + (big ? ' ' + w.text : ' · ' + w.text));
  }
  function loadWx() {
    fetch('https://api.weather.gov/points/' + LAT + ',' + LON).then(function (r) { return r.json(); })
      .then(function (p) { return fetch(p.properties.forecastHourly).then(function (r) { return r.json(); }); })
      .then(function (f) {
        var x = f.properties.periods[0];
        st.wx = { temp: x.temperature, text: x.shortForecast };
        var el = document.getElementById('wx'); if (el) el.innerHTML = wxText();
        document.querySelectorAll('[data-wx]').forEach(function (e) { e.innerHTML = wxText(true); });
      }).catch(function () {});
  }
  // Warnings and advisories for Chelsea (snow, flood, heat, wind...).
  function loadWxAlerts() {
    fetch('https://api.weather.gov/alerts/active?point=' + LAT + ',' + LON).then(function (r) { return r.json(); })
      .then(function (j) {
        st.wxAlerts = (j.features || []).map(function (f) { return f.properties || {}; })
          .filter(function (p) { return p.event && p.status !== 'Test' && (!p.ends || new Date(p.ends) > new Date()); })
          .map(function (p) {
            var end = p.ends || p.expires;
            return { ev: p.event, sev: p.severity, until: end ? new Date(end) : null, area: p.areaDesc || '' };
          });
        var el = document.getElementById('wxa'); if (el) el.innerHTML = wxAlertHtml();
      }).catch(function () {});
  }
  function wxAlertHtml() {
    var L = st.wxAlerts || [];
    if (!L.length) return '';
    var i = Math.floor(Date.now() / 10000) % L.length, a = L[i];
    var minor = !/severe|extreme/i.test(a.sev || '') && !/warning/i.test(a.ev);
    var until = a.until ? 'until ' + DAYS[a.until.getDay()].slice(0, 3) + ' ' + ampm(a.until) : '';
    return '<div class="wxa' + (minor ? ' minor' : '') + '"><b>⚠ ' + esc(a.ev) + '</b><span>' + esc([until, L.length > 1 ? (i + 1) + ' of ' + L.length : ''].filter(Boolean).join(' · ')) + '</span></div>';
  }

  // ---------- Clock, rotation, messages ----------
  var lastUrgent = false;
  setInterval(function () {
    var n = new Date();
    var c = document.getElementById('clk'); if (c) c.textContent = hm(n);
    document.querySelectorAll('[data-clk]').forEach(function (e) { e.textContent = hm(n); });
    var d = st.data;
    // An urgent alert that ran out: back to the boards.
    var urgent = !!(d && d.alert && (!d.alert.until || d.alert.until > Date.now()));
    if (urgent !== lastUrgent) { lastUrgent = urgent; render(); return; }
    if (urgent) return;
    // Next board when its time is up.
    if (d && d.boards && d.boards.length > 1) {
      var secs = d.boards[st.board].secs || 30;
      if (!st.boardAt) st.boardAt = Date.now();
      if (Date.now() - st.boardAt >= secs * 1000) { st.board = (st.board + 1) % d.boards.length; st.boardAt = Date.now(); render(); }
    }
    if (n.getSeconds() === 0) applyTheme();
    if (n.getSeconds() % 10 === 0 && (st.wxAlerts || []).length > 1) { var el = document.getElementById('wxa'); if (el) el.innerHTML = wxAlertHtml(); }
    showStatus();
  }, 1000);
  setInterval(function () {
    document.querySelectorAll('[data-rot]').forEach(function (box) {
      var kids = box.children; if (kids.length < 2) return;
      var i = 0; for (; i < kids.length; i++) if (!kids[i].hidden) break;
      kids[i % kids.length].hidden = true; kids[(i + 1) % kids.length].hidden = false;
    });
  }, 12000);
  // Hide the mouse after 3 seconds without moving; any move shows it again.
  var idleT = 0;
  var wake = function () {
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  };
  ['mousemove', 'mousedown', 'keydown', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, wake, { passive: true }); });
  wake();
  var turned = portrait();
  window.addEventListener('resize', function () { if (portrait() !== turned) { turned = portrait(); if (st.data) render(); } });

  // A copy kept on the TV, so it shows something right away after a restart.
  if (PREVIEW) {
    stop('Preview', 'Loading the board…');
    window.addEventListener('message', function (e) {
      var m = e.data;
      if (m && m.oidPreview && m.payload) { st.board = 0; st.prev = {}; st.data = null; take(m.payload); }
    });
    try { parent.postMessage({ oidPreviewReady: true }, '*'); } catch (e) {}
  } else {
    var saved = store.get('oid-box-' + id);
    if (saved) LOCK.open(saved).then(function (p) { if (!st.data) take(p); }, function () {});
    load();
    setInterval(load, POLL);
    // Phones pause pages in the background: check right away when it's looked at again.
    document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
    window.addEventListener('pageshow', function (e) { if (e.persisted) load(); });
    window.addEventListener('focus', load);
  }
  loadWx();
  setInterval(loadWx, 30 * 60000);
  loadWxAlerts();
  setInterval(loadWxAlerts, 5 * 60000);
  // A daily reload picks up page updates.
  setTimeout(function () { freshLoad(); }, (24 * 3600 - 300 + Math.random() * 600) * 1000);
})();
</script>
</body>
</html>
