<!DOCTYPE html>
<!--
  Chelsea PD - training sign-in and class sign-up.
  QR codes and links land here and go to the right page:
    ?c=...  class sign-up  (class.html)
    ?t=...  training check-in  (checkin.html)
  The check-in project's address is in config.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chelsea PD sign-in</title>
<script>
  (function () {
    var q = location.search || '';
    location.replace((/[?&]c=/.test(q) ? 'class.html' : 'checkin.html') + q + location.hash);
  })();
</script>
</head>
<body style="font:17px Arial,sans-serif;color:#13213A;padding:24px">Loading…</body>
</html>
