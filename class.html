<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class sign-up</title>
<script src="config.js"></script>
<script>
// ---------------------------------------------------------------------
// STALE PAGE CHECK
//
// Added to the home screen, this runs standalone: its own cache, no
// address bar, nothing to pull down. A phone can sit on a weeks-old
// copy and there is no obvious way to shift it.
//
// So the page checks for itself. It re-fetches its own file past the
// cache, reads the stamp below out of the fresh copy, and if that
// differs from the one it is running, reloads with a changing ?v= so
// the cache cannot serve the old file again.
//
// PAGE_VERSION must change whenever the page changes, or nothing here
// fires. Bump it in the same edit.
// ---------------------------------------------------------------------
var PAGE_VERSION = '2026-11-19g';
(function () {
  var checking = false, last = 0, found = '';
  function bar(v) {
    if (document.getElementById('newver')) return;
    var d = document.createElement('div');
    d.id = 'newver';
    d.setAttribute('style', 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#1C3159;color:#fff;' +
      'padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;' +
      'font:600 15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif');
    d.innerHTML = '<span style="flex:1">A newer version is ready.</span>' +
      '<button type="button" id="newver-go" style="flex:none;border:0;border-radius:10px;padding:10px 16px;' +
      'background:#fff;color:#1C3159;font:inherit;font-weight:700">Reload</button>';
    document.body.appendChild(d);
    document.getElementById('newver-go').onclick = function () { go(v); };
  }
  function go(v) {
    try {
      // Already tried once for this version and still here: stop, or the
      // page would reload in a loop.
      if (sessionStorage.getItem('ver-tried') === v) { bar(v); return; }
      sessionStorage.setItem('ver-tried', v);
    } catch (e) {}
    var u = new URL(location.href);
    u.searchParams.set('v', v);
    location.replace(u.toString());
  }
  // Mid-sentence, not merely "a box has focus": these pages focus a field
  // the moment they open, so the simpler test meant a stale page always
  // waited to be tapped instead of fixing itself.
  var typedAt = 0;
  ['input', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, function () { typedAt = Date.now(); }, true);
  });
  function busy() {
    if (Date.now() - typedAt > 45000) return false;
    var a = document.activeElement;
    return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'));
  }
  function check() {
    if (checking || document.hidden) return;
    if (Date.now() - last < 60000) return;
    last = Date.now(); checking = true;
    fetch(location.pathname + '?cb=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) {
        checking = false;
        var m = t.match(/PAGE_VERSION\s*=\s*'([^']+)'/);
        if (!m || m[1] === PAGE_VERSION) return;
        found = m[1];
        // Don't yank the page out from under someone typing.
        if (busy()) { bar(found); return; }
        go(found);
      })
      .catch(function () { checking = false; });
  }
  // On open, and every time they come back to it - which is the moment a
  // home screen app would otherwise show its weeks-old copy.
  setTimeout(check, 4000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) setTimeout(check, 400); });
  window.addEventListener('focus', function () { setTimeout(check, 400); });
})();
</script>
<style>
  :root {
    --navy: #1C3159; --gold: #C8A64B; --ink: #13213A; --muted: #5E6A7D; --line: #D5DCE7;
    --bg: #EDF1F7; --card: #FFFFFF; --ok: #1E7A4C; --okbg: #E5F3EB; --err: #B3261E; --errbg: #FBEAE9;
    --wait: #7A5200; --waitbg: #FFF4D6; --focus: #2F5DA8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .top { background: var(--bg); color: var(--ink); border-bottom: 1px solid var(--line); padding: calc(12px + env(safe-area-inset-top)) 16px 12px; }
  .top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .top img { width: 44px; height: 44px; object-fit: contain; flex: none; }
  .top b { display: block; font-size: 19px; font-weight: 700; color: var(--navy); }
  .top span { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .mylink { margin-left: auto; flex: none; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--navy); color: var(--navy); font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(120px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0 0 14px; }
  .title { margin: 0; font-size: 22px; line-height: 1.25; color: var(--navy); }
  .meta { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  .notes { margin: 10px 0 0; font-size: 15px; white-space: pre-wrap; }
  .cat { display: inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 6px; background: #E6EBF3; color: var(--navy); font-size: 13px; font-weight: 600; }
  h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  h2 i { font-style: normal; color: var(--navy); }
  .note { color: var(--muted); font-size: 15px; }
  .banner { margin: 0 0 14px; padding: 12px 14px; border-radius: 12px; font-size: 15px; font-weight: 600; }
  .banner.closed { background: var(--errbg); color: var(--err); }
  .banner.mine { background: var(--okbg); color: var(--ok); }
  .banner.none { background: var(--waitbg); color: var(--wait); }
  .stop { text-align: center; padding: 30px 18px; }
  .stop h1 { margin: 0 0 8px; font-size: 21px; color: var(--navy); }

  .find { position: relative; }
  input[type=text] {
    width: 100%; min-height: 50px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 17px;
  }
  input[type=text]:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(47, 93, 168, .18); }
  .drop {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; margin: 0; padding: 4px; list-style: none;
    background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(19, 33, 58, .16);
  }
  .drop[hidden] { display: none; }
  .drop button {
    display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; min-height: 50px;
    padding: 6px 12px; border: 0; border-radius: 9px; background: none; text-align: left; cursor: pointer;
  }
  .drop button:hover, .drop button:focus { background: #EEF2F8; outline: none; }
  .drop small { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .drop .none { padding: 12px; color: var(--muted); font-size: 15px; }
  .picked { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 8px 8px 14px; border: 1.5px solid var(--navy); border-radius: 12px; background: #F3F6FB; }
  .picked div { flex: 1; min-width: 0; }
  .picked b { display: block; }
  .picked small { color: var(--muted); font-size: 14px; }
  .link { border: 0; background: none; color: var(--focus); font-weight: 600; padding: 10px 2px; cursor: pointer; font-size: 15px; }

  /* One card per date */
  .date { padding: 0; overflow: hidden; }
  .date.me { border: 2px solid var(--ok); }
  .date.mewait { border: 2px solid #E8C96A; }
  .dhead { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px 10px; }
  .dhead div { flex: 1; min-width: 0; }
  .dhead b { display: block; font-size: 18px; color: var(--navy); }
  .dhead small { display: block; color: var(--muted); font-size: 14px; }
  .seats { flex: none; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; background: var(--okbg); color: var(--ok); }
  .seats.full { background: var(--errbg); color: var(--err); }
  .seats.past { background: #E9ECF1; color: var(--muted); }
  .bar { height: 6px; margin: 0 16px 10px; border-radius: 3px; background: #E9ECF1; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--navy); }
  .who { margin: 0; padding: 0 16px 8px; list-style: none; }
  .who li { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 15px; border-top: 1px solid #EEF1F5; }
  .who li:first-child { border-top: 0; }
  .who li.you { font-weight: 700; }
  .cs { flex: none; min-width: 42px; padding: 1px 6px; border-radius: 6px; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; text-align: center; }
  .who .w .cs { background: #C9A443; }
  .open { color: var(--muted); font-size: 14px; padding: 4px 0 8px; border: 0; }
  .wl { margin: 4px 16px 0; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--wait); font-weight: 700; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 16px 16px; }
  .btn {
    min-height: 50px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--navy); color: #fff;
    font-size: 17px; font-weight: 700; cursor: pointer; flex: 1 1 auto;
  }
  .btn.ghost { background: #fff; color: var(--navy); border: 1.5px solid var(--navy); }
  .btn.warn { background: var(--err); }
  .btn:disabled { opacity: .55; }
  .state { flex: 1 1 100%; font-weight: 700; font-size: 15px; }
  .state.ok { color: var(--ok); }
  .state.wait { color: var(--wait); }
  .drop-link { border: 0; background: none; color: var(--err); font-weight: 600; font-size: 15px; padding: 10px 2px; cursor: pointer; }
  .rpbox { margin: 4px 16px 0; padding: 10px 12px 2px; border-radius: 12px; background: #F3F6FB; border: 1px dashed #B9C6DA; }
  .rpbox.me { background: #EAF4EE; border: 1.5px solid var(--ok); }
  .rphead { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--navy); }
  .rphead span { letter-spacing: 0; text-transform: none; font-size: 13px; padding: 2px 9px; border-radius: 999px; background: #E2E8F2; color: var(--navy); }
  .rphead span.full { background: var(--errbg); color: var(--err); }
  .rpbox .who { padding: 4px 0 4px; }
  .rpbox .who .cs { background: #4F6A97; }
  .rpbox .acts { padding: 4px 0 10px; }
  .rpbox .btn { min-height: 46px; font-size: 16px; }
  .donote { flex: 1 1 100%; font-size: 14px; color: var(--muted); }
  .foot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; margin-top: 4px; }

  /* The topics as a list you can read, rather than a sentence with five
     long names run together in it. Doubles as the progress tracker. */
  .tlist { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .tlist li { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .tmark { flex: none; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--card);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; }
  .tlist li.got .tmark { background: var(--ok); border-color: var(--ok); }
  .tname { flex: 1 1 auto; line-height: 1.3; }
  .tlist li.got .tname { color: var(--muted); }
  .twhen { flex: none; font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap;
    background: var(--waitbg); color: var(--wait); }
  .tlist li.got .twhen { background: var(--okbg); color: var(--ok); }
  .topic { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 2px 10px; font-size: 19px; color: var(--navy); }
  .topic span { font-size: 13px; padding: 3px 10px; border-radius: 999px; }
  .topic span.ok { background: var(--okbg); color: var(--ok); }
  .topic span.need { background: var(--waitbg); color: var(--wait); }
  .pinov { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(19, 33, 58, .5); padding: 12px; }
  .pinov[hidden] { display: none; }
  .pincard { width: 100%; max-width: 480px; background: #fff; border-radius: 16px; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
  @media (min-height: 600px) { .pinov { align-items: center; } }
  .pint { margin: 0 0 6px; font-size: 20px; letter-spacing: 0; text-transform: none; color: var(--navy); }
  .pinf { display: block; margin: 12px 0 0; }
  .pinf span { display: block; font-size: 14px; font-weight: 700; margin: 0 0 4px; }
  .pinf input { width: 100%; min-height: 50px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 20px; }
  .pinf input[type=password] { letter-spacing: 8px; font-weight: 700; }
  .pinconf { display: flex; gap: 8px; margin-top: 10px; }
  .pinconf .btn { flex: 1; min-height: 44px; font-size: 15px; }
  .pin-err { color: var(--err); font-weight: 600; min-height: 1.3em; margin: 10px 0 0; font-size: 15px; }
  .pinbtns { display: flex; gap: 10px; margin-top: 12px; }
  .calstrip { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 14px 0 0; }
  .calstrip > div { flex: 1 1 170px; }
  .calstrip b { display: block; font-size: 15px; color: var(--navy); }
  .calstrip small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .calstrip .btn { flex: none; min-height: 44px; font-size: 15px; padding: 0 16px; }
  .callink { text-decoration: none; }
  .actrow { display: flex; align-items: center; gap: 10px; width: 100%; }
  .actrow .btn { flex: 1 1 auto; width: auto; }
  .actrow .drop-link { flex: none; margin-left: auto; }
  .ctrls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 14px; }
  .ctrls .viewpick { flex: 1 1 100%; margin: 0; }
  .ctrls .squadtog { flex: 0 1 auto; margin: 0; }
  .sect { display: flex; align-items: baseline; gap: 10px; margin: 18px 2px 10px; }
  .sect .tally { flex: none; margin-left: auto; font-style: normal; font-size: 12px; font-weight: 700;
    letter-spacing: 0; text-transform: none; color: var(--wait); background: var(--waitbg);
    border-radius: 999px; padding: 3px 10px; }
  .sect .tally.done { color: var(--ok); background: var(--okbg); }
  .whoslim { padding: 10px 12px; }
  .whoslim .picked { min-height: 48px; border-width: 1px; }
  .whoslim .note { font-size: 13px; }
  /* The view picker. It used to sit there looking like a disabled field
     and people walked straight past it, so it is big, navy and obviously
     something you press. */
  .viewpick { display: block; margin: 0 0 12px; }
  .viewpick label { display: block; margin: 0 2px 6px; font-size: 13px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--navy); font-weight: 700; }
  .viewsel { position: relative; }
  .viewpick select { -webkit-appearance: none; appearance: none; display: block; width: 100%;
    min-height: 56px; padding: 0 46px 0 16px; border-radius: 14px; border: 2px solid var(--navy);
    background: var(--card); color: var(--navy); font: inherit; font-size: 18px; font-weight: 700;
    box-shadow: 0 2px 0 rgba(28, 49, 89, .14); cursor: pointer; }
  .viewpick select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .viewarr { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none;
    width: 26px; height: 26px; border-radius: 8px; background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1; }
  /* Month grid. Only days with a session are tappable; tapping one opens
     that day underneath, so signing up works exactly as it does in the
     other two views. */
  .calwrap { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin: 0 0 12px; }
  .calmon { font-size: 15px; font-weight: 700; color: var(--navy); margin: 2px 2px 10px; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .caldow { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding-bottom: 4px; }
  .calday { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    min-height: 44px; border: 0; border-radius: 10px; background: none; color: var(--muted); font: inherit; font-size: 14px; }
  .calday.out { visibility: hidden; }
  .calday.has { background: #E6EBF3; color: var(--navy); font-weight: 700; cursor: pointer; }
  .calday i { font-style: normal; font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: -.02em; white-space: nowrap; }
  .calday.got { background: var(--okbg); color: var(--ok); }
  .calday.got i { color: var(--ok); }
  .calday.sel { outline: 2.5px solid var(--navy); outline-offset: -2.5px; }
  /* ---- The grid: topics down the side, weeks across the top ---- */
  .gwrap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .gtable { display: grid; grid-template-columns: 132px repeat(var(--gcols), 108px); gap: 6px; width: max-content; }
  /* The topic column holds still while the weeks scroll past. The shadow
     paints over the column gap so nothing slides through it. */
  .gstick { position: sticky; left: 0; z-index: 2; background: var(--card); padding-left: 10px;
    box-shadow: 6px 0 0 0 var(--card), 11px 0 8px -8px rgba(19, 33, 58, .2); }
  .gcorner { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; display: flex; align-items: flex-end; padding: 0 6px 6px 10px; }
  .ghead { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px 6px;
    font-size: 13px; font-weight: 700; color: var(--navy); text-align: center; }
  .ghead small { font-size: 11px; font-weight: 600; color: var(--muted); }
  .ghead button { margin-top: 2px; border: 1.5px solid var(--line); background: var(--card); color: var(--focus);
    border-radius: 999px; font: inherit; font-size: 11px; font-weight: 700; padding: 2px 8px; cursor: pointer; }
  .ghead button:disabled { color: var(--line); border-color: #EDF1F7; cursor: default; }
  .grow { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 6px 8px 6px 10px;
    border-right: 1px solid var(--line); }
  .grow b { font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.2; }
  .grow small { font-size: 11px; font-weight: 700; color: var(--wait); }
  .grow small.on { color: var(--ok); }
  .gcell { min-height: 56px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card);
    color: var(--ink); font: inherit; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; padding: 4px 2px; cursor: pointer; text-align: center; }
  .gcell b { font-size: 13px; font-weight: 700; }
  .gcell small { font-size: 11px; font-weight: 700; color: var(--muted); }
  .gcell i { font-style: normal; font-size: 10px; font-weight: 700; color: var(--navy); }
  .gcell.got { background: var(--okbg); border-color: var(--ok); }
  .gcell.got small, .gcell.got b { color: var(--ok); }
  .gcell.pick { background: var(--navy); border-color: var(--navy); }
  .gcell.pick b, .gcell.pick small, .gcell.pick i { color: #fff; }
  .gcell.full { background: #F3F5F9; color: var(--muted); }
  .gcell.full small { color: var(--err); }
  .gcell.sel { outline: 2.5px solid var(--focus); outline-offset: -3px; }
  .gcell.none { border-style: dashed; border-color: #E6EBF3; cursor: default; }
  .glegend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 2px 0; font-size: 12px; color: var(--muted); }
  .glegend span { display: flex; align-items: center; gap: 5px; }
  .glegend b { width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--line); }
  .ghint { margin: 8px 2px 0; font-size: 13px; color: var(--muted); }
  .squadtog { display: flex; align-items: center; gap: 9px; margin: -4px 2px 12px; font-size: 15px; color: var(--muted); }
  .squadtog input { width: 20px; height: 20px; accent-color: var(--navy); }
  .squadoff { color: var(--navy) !important; font-weight: 700 !important; }
  .calnav { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .calnav b { flex: 1; text-align: center; font-size: 16px; font-weight: 700; color: var(--navy); }
  .calnav button { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--navy); font-size: 22px; line-height: 1; font-family: inherit; cursor: pointer; }
  .calnav button:disabled { color: var(--line); cursor: default; }
  .calday.pick { background: var(--navy); color: #fff; }
  .calday.pick i { color: #fff; }
  .calpickrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin: 0 0 8px;
    padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font: inherit; color: var(--ink); }
  .calpickrow small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); font-weight: 400; }
  .calpickrow span { flex: 1; font-weight: 700; }
  .calpickrow em { flex: none; font-style: normal; font-size: 14px; font-weight: 700; color: var(--navy); }
  .calpickrow.on { border-color: var(--navy); background: #E6EBF3; }
  .calpickrow.mine { border-color: var(--ok); background: var(--okbg); }

  .calwho { color: var(--navy) !important; font-weight: 600 !important; }
  .calbar { background: var(--card); border: 1.5px solid var(--navy); border-radius: 16px; padding: 14px; margin: 0 0 14px; }
  .calbar > b { display: block; font-size: 16px; color: var(--navy); }
  .calbar ul { list-style: none; margin: 10px 0 12px; padding: 0; }
  .calbar li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .calbar li span { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
  .calbar li small { color: var(--wait); font-weight: 700; }
  .calbar .link { display: block; width: 100%; margin-top: 8px; padding: 8px; border: 0; background: none;
    color: var(--muted); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .callegend { display: flex; gap: 14px; margin: 10px 2px 0; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .callegend b { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .dtopic { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 2px; }
  .dtopic em { font-style: normal; font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 6px; background: #E6EBF3; color: var(--navy); }
  .dtopic .have { font-size: 13px; font-weight: 700; color: var(--ok); }
  .dayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 20px 2px 10px; padding: 0 0 8px; border-bottom: 2px solid var(--navy); }
  .dayhead b { font-size: 19px; color: var(--navy); }
  .dayhead span { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .dhead b.tbig { font-size: 22px; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
  .daygap { margin: 16px 2px 8px; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .swfrom { margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; background: #F3F6FB; font-size: 16px; line-height: 1.5; }
  .swfrom s { color: var(--muted); }
  .donebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: #fff; border-top: 1px solid var(--line);
    box-shadow: 0 -6px 20px rgba(19, 33, 58, .12); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .donebar[hidden] { display: none; }
  .donebar div { max-width: 560px; margin: 0 auto; }
  .donebar p { margin: 0 0 8px; font-size: 14px; color: var(--muted); text-align: center; }
  .donebar .btn { width: 100%; background: var(--ok); }
  body.hasdone .toast { bottom: calc(118px + env(safe-area-inset-bottom)); }
  .saving { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 25; padding: 5px 12px; border-radius: 999px;
    background: #fff; color: var(--navy); font-size: 13px; font-weight: 700; box-shadow: 0 4px 14px rgba(19, 33, 58, .2); }
  .saving.retry { color: var(--err); }
  .saving.done { color: var(--ok); }
  .saving[hidden] { display: none; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
    max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 15px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
  }
  .toast.bad { background: var(--err); }
  .toast[hidden] { display: none; }
</style>

<body>
<header class="top"><div class="top-in">
  <img id="patch" alt="" hidden>
  <div><span>Class sign-up</span><b id="dept"></b></div>
  <a class="mylink" href="mytraining.html">My training</a>
</div></header>
<main id="app"><p style="text-align:center;color:#5E6A7D;padding:40px 0">Loading…</p></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// This page lives on GitHub. Google won't show pages from the check-in
// project, so this page asks the project for its data instead
// (APP_URL is in config.js).
var DATA = null;
var FN = { ciSubmit: 'checkinSubmit', ciClassSignup: 'classSignup', ciClassState: 'classState' };
function api(name, arg) {
  return fetch(APP_URL, { method: 'POST', body: JSON.stringify({ pub: name, arg: arg }) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function runner(ok, fail) {
  var r = {
    withSuccessHandler: function (f) { return runner(f, fail); },
    withFailureHandler: function (f) { return runner(ok, f); }
  };
  Object.keys(FN).forEach(function (k) {
    r[k] = function (arg) {
      api(FN[k], arg).then(function (res) { if (ok) ok(res); }, function (e) { if (fail) fail(e); });
    };
  });
  return r;
}
var google = { script: { run: runner(null, null) } };

function start() {
(function () {
  var app = document.getElementById('app');
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  $('dept').textContent = DATA.dept || '';
  if (DATA.patch) { var img = $('patch'); img.src = DATA.patch; img.hidden = false; img.onerror = function () { img.hidden = true; }; }
  if (!DATA.ok) { stop('Class sign-up', DATA.message); return; }

  // The same phone id the check-in page uses. Sign-ups made on this
  // phone can only be changed on this phone.
  var device = store.get('ci-device');
  if (!device) { device = String(Date.now()) + Math.random().toString(36).slice(2, 10); store.set('ci-device', device); }
  var meKey = 'ci-class-me-' + DATA.c;
  // In-Service: list the dates by topic (default) or all by date. Remembered on this phone.
  var SORTS = { grid: 'Grid \u2014 every week at once', topic: 'By topic', date: 'By date', cal: 'By calendar' };
  var sortBy = SORTS[store.get('ci-class-sort')] ? store.get('ci-class-sort') : '';
  var calDay = '';    // a day with several sessions, opened to choose one
  var calMonth = '';  // the month on screen, 'YYYY-MM'
  var calPick = {};   // dates chosen but not confirmed yet, by id
  var gridOpen = '';  // the grid cell opened underneath, by date id

  // Picks live on this phone until they're confirmed, so a locked screen
  // or a stray reload doesn't throw away a careful set of choices.
  function pickKey() { return st.me ? 'ci-pick-' + DATA.c + '-' + st.me.name + '|' + st.me.call : ''; }
  function savePicks() {
    if (!st.me) return;
    var ids = Object.keys(calPick);
    store.set(pickKey(), ids.length ? JSON.stringify(ids) : '');
  }
  function loadPicks() {
    calPick = {};
    if (!st.me) return;
    var raw = store.get(pickKey());
    if (!raw) return;
    try {
      JSON.parse(raw).forEach(function (id) {
        var d = st.cls.dates.filter(function (x) { return x.id === id; })[0];
        // Anything cancelled, gone, past or already theirs quietly drops out.
        if (d && !d.cancelled && d.date >= st.today && !d['in'].some(isMe)) calPick[id] = true;
      });
    } catch (e) {}
  }

  var st = { cls: DATA.cls, today: DATA.today, done: DATA.done || [], me: null, matches: [], busy: '', confirm: '', confirmTimer: null };

  function peopleOf(list) {
    return (list || []).map(function (p) {
      var name = String(p[0] || ''), words = name.toLowerCase().split(/[\s.,'-]+/).filter(Boolean);
      return { name: name, call: String(p[1] || ''), rank: String(p[2] || ''), words: words, last: words[words.length - 1] || '' };
    }).sort(function (a, b) { return (a.last + a.name).localeCompare(b.last + b.name); });
  }
  var PEOPLE = peopleOf(st.cls.people);

  // The page may open with the copy saved on this phone; the fresh one
  // replaces it a moment later.
  window.ciFresh = function (d) {
    if (!d || !d.ok || st.sending || st.queue.length) return;
    st.cls = d.cls; st.today = d.today || st.today; if (d.done) st.done = d.done;
    PEOPLE = peopleOf(st.cls.people);
    if (!(document.activeElement && document.activeElement.id === 'q') && !($('pinov') && !$('pinov').hidden) && !($('swov') && !$('swov').hidden)) render();
  };
  window.ciGone = function (m) { stop('Class sign-up', m); };

  // The name picked on this phone before is remembered.
  try {
    // Who picked on this phone: for this class, or the last class.
    var saved = JSON.parse(store.get(meKey) || 'null') || JSON.parse(store.get('ci-class-me') || 'null');
    if (saved) st.me = PEOPLE.filter(function (p) { return p.name === saved.name && p.call === saved.call; })[0] ||
      // Their name changed in the Employee Directory: same call sign.
      (saved.call ? PEOPLE.filter(function (p) { return p.call && p.call.toUpperCase() === String(saved.call).toUpperCase(); })[0] : null) || null;
  } catch (e) {}

  loadPicks();   // anything picked last time and never confirmed
  render();

  function stop(title, message) {
    app.innerHTML = '<div class="card stop"><h1>' + esc(title) + '</h1><p class="note">' + esc(message) + '</p></div>';
  }

  function day(d) {
    var m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return d || '';
    return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][new Date(+m[1], +m[2] - 1, +m[3]).getDay()] + ', ' +
      ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][+m[2] - 1] + ' ' + (+m[3]);
  }
  function shortDay(d) {
    var m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return d || '';
    return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(+m[1], +m[2] - 1, +m[3]).getDay()] + ' ' + (+m[2]) + '/' + (+m[3]);
  }
  function times(d) { return d.start ? d.start + (d.end ? '-' + d.end : '') : ''; }

  // ---------- Putting the dates on their own calendar ----------
  // In-Service sends no email, so the calendar file has to come from the
  // page. One file holds every date they hold a seat on.

  function myDates() {
    if (!st.me) return [];
    return st.cls.dates.filter(function (d) { return !d.cancelled && d['in'].some(isMe); })
      .slice().sort(function (a, b) { return (a.date + (a.start || '')).localeCompare(b.date + (b.start || '')); });
  }
  function icsEsc(t) { return String(t == null ? '' : t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
  function icsStamp(date, hhmm) { return date.replace(/-/g, '') + 'T' + (hhmm || '0000') + '00'; }
  function icsNextDay(date) {
    var d = new Date(+date.slice(0, 4), +date.slice(5, 7) - 1, +date.slice(8, 10) + 1);
    return d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
  }
  // Times are written without a zone, so each phone reads them as local
  // time - which is what a shift that starts at 0800 means.
  function icsText(list) {
    var c = st.cls, now = new Date();
    var utc = now.getUTCFullYear() + ('0' + (now.getUTCMonth() + 1)).slice(-2) + ('0' + now.getUTCDate()).slice(-2) +
      'T' + ('0' + now.getUTCHours()).slice(-2) + ('0' + now.getUTCMinutes()).slice(-2) + ('0' + now.getUTCSeconds()).slice(-2) + 'Z';
    var out = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Chelsea PD//Training//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
    list.forEach(function (d) {
      var title = c.title + (d.topic ? ' - ' + d.topic : '');
      out.push('BEGIN:VEVENT',
        'UID:' + DATA.c + '-' + d.id + '@chelseapd-training',
        'DTSTAMP:' + utc,
        d.start ? 'DTSTART:' + icsStamp(d.date, d.start) : 'DTSTART;VALUE=DATE:' + d.date.replace(/-/g, ''),
        d.start ? 'DTEND:' + icsStamp(d.date, d.end || d.start) : 'DTEND;VALUE=DATE:' + icsNextDay(d.date),
        'SUMMARY:' + icsEsc(title));
      var where = d.location || c.location;
      if (where) out.push('LOCATION:' + icsEsc(where));
      if (c.notes) out.push('DESCRIPTION:' + icsEsc(c.notes));
      out.push('BEGIN:VALARM', 'TRIGGER:-PT12H', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(title), 'END:VALARM');
      out.push('END:VEVENT');
    });
    out.push('END:VCALENDAR');
    // Long lines are folded at 75 characters, as the calendar format
    // asks: Outlook is fussy about it where phones are not.
    return out.map(function (line) {
      if (line.length <= 75) return line;
      var parts = [line.slice(0, 75)];
      for (var i = 75; i < line.length; i += 74) parts.push(' ' + line.slice(i, i + 74));
      return parts.join('\r\n');
    }).join('\r\n');
  }
  function calFileName() {
    return (st.cls.title || 'training').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() + '.ics';
  }
  function addToCalendar(only) {
    var list = only && only.length ? only : myDates();
    if (!list.length) { toast('You haven\'t got any dates yet.', true); return; }
    var text = icsText(list);
    try {
      var blob = new Blob([text], { type: 'text/calendar;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = list.length === 1 ? calFileOne(list[0]) : calFileName();
      document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
    } catch (e) {
      // Older phones: hand them the file straight, which opens the
      // calendar's own "add these events" screen.
      window.location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(text);
    }
    toast(list.length === 1 ? 'Opening your calendar\u2026' : 'Opening your calendar with all ' + list.length + ' dates\u2026');
  }
  // One date downloads as its own file, named for its topic.
  function calFileOne(d) {
    return ((d.topic || st.cls.title || 'training')).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() + '.ics';
  }
  // One date, straight into Google Calendar.
  function googleCalUrl(d) {
    var c = st.cls, where = d.location || c.location || '';
    var span = d.start ? icsStamp(d.date, d.start) + '/' + icsStamp(d.date, d.end || d.start)
      : d.date.replace(/-/g, '') + '/' + icsNextDay(d.date);
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' +
      encodeURIComponent(c.title + (d.topic ? ' - ' + d.topic : '')) + '&dates=' + span +
      (where ? '&location=' + encodeURIComponent(where) : '') + (c.notes ? '&details=' + encodeURIComponent(c.notes) : '');
  }

  // ---- Which squad is off, counted forward from the anchor in config.js ----
  // Four on, four off, two squads: an eight-day cycle. One squad works
  // every day, so the other one is off.
  // Four on, four off, A and B alternating. The anchor is a date that
  // was the FIRST of a four-day block, and letter is the squad that
  // started working it: 17 Nov 2026 was Squad A's first day, through
  // the 20th.
  //
  // It lives here rather than only in config.js so that installing this
  // one file is enough. config.js can still override it - set anchor to
  // '' there to switch the labels off, or to a new date if the rotation
  // ever resets.
  function rota() {
    // Inside the function on purpose: render() runs before the bottom of
    // this module is reached, so a var out here is still undefined the
    // first time anything asks.
    var SQUAD_FALLBACK = { anchor: '2026-11-17', letter: 'A', on: 4, off: 4, squads: ['A', 'B'] };
    // config.js wins only when it names a real date. An old config.js,
    // or one still carrying the blank anchor it shipped with, falls back
    // to the date above rather than silently switching the labels off.
    var good = function (x) { return x && /^\d{4}-\d{2}-\d{2}$/.test(x.anchor || ''); };
    var r = (typeof SQUAD_ROTATION !== 'undefined' && good(SQUAD_ROTATION)) ? SQUAD_ROTATION : SQUAD_FALLBACK;
    if (!good(r)) return null;
    var sq = (r.squads && r.squads.length === 2) ? r.squads : ['A', 'B'];
    var on = +r.on || 4, off = +r.off || 4;
    return { anchor: r.anchor, letter: r.letter || sq[0], on: on, off: off, cycle: on + off, squads: sq };
  }
  function ymdToDays(k) {
    return Math.round(Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10)) / 86400000);
  }
  // The squad OFF on this date, or '' when the rotation isn't set up.
  function squadOff(key) {
    var r = rota();
    if (!r || !/^\d{4}-\d{2}-\d{2}$/.test(key)) return '';
    var n = ((ymdToDays(key) - ymdToDays(r.anchor)) % r.cycle + r.cycle) % r.cycle;
    var working = n < r.on ? r.letter : (r.squads[0] === r.letter ? r.squads[1] : r.squads[0]);
    return r.squads[0] === working ? r.squads[1] : r.squads[0];
  }
  function showSquads() { return rota() && store.get('ci-class-squads') !== 'off'; }
  // The same person: by call sign when both have one, otherwise by name.
  function samePerson(x, me) {
    if (!me) return false;
    if (x.c && me.call) return String(x.c).toUpperCase() === String(me.call).toUpperCase();
    return String(x.n || '').toLowerCase().replace(/[^a-z]/g, '') === String(me.name || '').toLowerCase().replace(/[^a-z]/g, '');
  }
  function isMe(x) { return samePerson(x, st.me); }
  // Role players. hasRp: this class takes them. doneMe: this officer already
  // took the training (still current), so they can role-play but not attend.
  function hasRp() { return !!st.cls.rp; }
  function doneMe() {
    if (!st.me || !hasRp() || isIS()) return false;
    var c = String(st.me.call || '').toUpperCase(), n = String(st.me.name || '').toLowerCase().replace(/[^a-z]/g, '');
    return (c && st.done.indexOf('c:' + c) >= 0) || (!!n && st.done.indexOf('n:' + n) >= 0);
  }
  function rpOf(d) { return { seat: (d.rp || []).some(isMe), wait: (d.rpWait || []).map(isMe).indexOf(true) }; }

  function closedReason() {
    var c = st.cls;
    if (c.cancelled) return 'This class was cancelled.';
    if (!c.open) return 'Sign-ups are closed. See the training officer to make a change.';
    if (c.deadline && st.today > c.deadline) return 'The sign-up deadline has passed. See the training officer to make a change.';
    return '';
  }

  // In-Service (category "In-Service"): one date per topic. g is the
  // topic; other classes are one group ('').
  function isIS() { return st.cls.kind === 'inservice'; }
  function myStatus(g) {
    var seat = null, wait = null;
    st.cls.dates.forEach(function (d) {
      if (isIS() && d.topic !== g) return;
      if (d.date < st.today || d.cancelled) return; // a date already past (attended) doesn't count against a new one
      d['in'].forEach(function (x) { if (isMe(x)) seat = d; });
      d.wait.forEach(function (x, i) { if (isMe(x)) wait = { d: d, pos: i + 1 }; });
    });
    return { seat: seat, wait: wait };
  }

  // Changes made, Done not tapped yet (remembered on this phone).
  function dirtyKey() { return st.me ? 'ci-dirty-' + DATA.c + '-' + st.me.name + '|' + st.me.call : ''; }
  function isDirty() { return !!(st.me && store.get(dirtyKey())); }
  function setDirty(on) { if (st.me) store.set(dirtyKey(), on ? '1' : ''); }
  function drawDone() {
    var bar = $('donebar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'donebar'; bar.className = 'donebar';
      bar.innerHTML = '<div><p id="donesay"></p>' +
        '<button type="button" class="btn" id="done-go">Done</button></div>';
      document.body.appendChild(bar);
      bar.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('#done-go')) finish(); });
    }
    var show = isDirty();
    bar.hidden = !show;
    document.body.classList.toggle('hasdone', show);
    var say = $('donesay');
    if (say) say.textContent = isIS() ? 'Your dates are saved. Tap Done to check what\'s left.'
      : 'Finished picking? We\'ll email you one list of all your dates.';
    var b = $('done-go');
    if (b) { b.disabled = !!st.finishing; b.textContent = st.finishing ? 'Sending…' : 'Done'; }
  }
  function finish() {
    if (st.finishing) return;
    if (!st.pin && !myPass()) { pinAsk(hasPin() ? 'need' : 'new', '', { op: 'done', d: '' }); return; }
    send('done', '');
  }

  function render() {
    drawDone();
    var c = st.cls;
    var closed = closedReason();
    var groups = isIS() ? (c.topics || []) : [''];
    // Settle the view first: the grid carries its own checklist, so the
    // page above it can be much shorter.
    if (!sortBy) sortBy = 'date';
    if (sortBy === 'grid' && !(isIS() && gridPlan())) sortBy = isIS() ? 'topic' : 'date';
    var onGrid = sortBy === 'grid' && isIS();
    // A pick that's since become theirs, was cancelled or has passed
    // drops out, however it got there (a stale cache, another phone).
    if (st.me) {
      var dropped = false;
      Object.keys(calPick).forEach(function (id) {
        var x = c.dates.filter(function (y) { return y.id === id; })[0];
        if (!x || x.cancelled || x.date < st.today || x['in'].some(isMe)) { delete calPick[id]; dropped = true; }
      });
      if (dropped) savePicks();
    }
    var mine = myStatus(groups[0]);
    var html =
      '<div class="card"><h1 class="title">' + esc(c.title) + '</h1>' +
        (c.location ? '<p class="meta">' + esc(c.location) + '</p>' : '') +
        (c.category ? '<span class="cat">' + esc(c.category) + '</span>' : '') +
        (c.notes ? '<p class="notes">' + esc(c.notes) + '</p>' : '') +
        (hasRp() ? '<p class="meta"><b>Role players wanted.</b> Anyone can sign up as a role player, even if you\'ve already taken this training.</p>' : '') +
        (isIS() ? '<p class="meta">Pick one date for each topic' + (onGrid ? '. The grid below shows every week at once' : '') +
          '. You can come back and finish later.</p>' : '') +
        (isIS() && !onGrid ? topicList(groups) : '') +
        (c.deadline && !closed ? '<p class="meta"><b>Sign up by ' + esc(day(c.deadline)) + '.</b></p>' : '') +
      '</div>';
    if (closed) html += '<div class="banner closed">' + esc(closed) + '</div>';

    html += st.me
      ? '<div class="card whoslim"><div id="who"></div></div>'
      : '<div class="card"><h2><i>1</i> &nbsp;Who are you?</h2><div id="who"></div></div>';

    if (st.me && isIS()) {
      var left = groups.filter(function (g) { return !myStatus(g).seat; });
      // The checklist at the top says which ones are left, so this says
      // how far along they are and nothing more.
      if (!left.length) html += '<div class="banner mine">All ' + groups.length + ' topics booked. You\'re done!</div>';
      else if (!onGrid) html += '<div class="banner ' + (left.length < groups.length ? 'mine' : 'none') + '">' +
        (groups.length - left.length) + ' of ' + groups.length + ' topics booked. ' +
        (left.length === 1 ? 'One to go.' : left.length + ' to go.') + '</div>';
    } else if (st.me && doneMe()) {
      html += '<div class="banner none">You\'ve already completed this training, so you can\'t sign up to attend. You can sign up as a <b>role player</b> on any date below.</div>';
    } else if (st.me) {
      if (mine.seat) {
        html += '<div class="banner mine">You\'re signed up for ' + esc(shortDay(mine.seat.date) + (times(mine.seat) ? ' ' + times(mine.seat) : '')) + '.' +
          (mine.wait ? ' You\'re also #' + mine.wait.pos + ' on the waitlist for ' + esc(shortDay(mine.wait.d.date)) + '.' : '') + '</div>';
      } else if (mine.wait) {
        html += '<div class="banner none">You\'re #' + mine.wait.pos + ' on the waitlist for ' + esc(shortDay(mine.wait.d.date)) +
          '. You don\'t have a seat yet' + (closed ? '.' : ': you can also sign up for a date with open seats.') + '</div>';
      } else if (!closed) {
        html += '<div class="banner none">You haven\'t signed up yet. Pick a date below.</div>';
      }
    }

    if (st.me && hasRp()) {
      var rpMine = c.dates.filter(function (d) { return rpOf(d).seat && d.date >= st.today; });
      if (rpMine.length) html += '<div class="banner mine">You\'re a role player on ' + esc(rpMine.map(function (d) { return shortDay(d.date) + (times(d) ? ' ' + times(d) : ''); }).join(', ')) + '.</div>';
    }
    var headText = st.me && !closed ? (isIS() ? 'Pick a date for each topic' : 'Pick a date') : 'Dates';
    var tally = '';
    if (st.me && isIS()) {
      var gotN = groups.filter(function (g) { return myStatus(g).seat; }).length;
      tally = '<em class="tally' + (gotN === groups.length ? ' done' : '') + '">' + gotN + ' of ' + groups.length + ' booked</em>';
    }
    var booked = myDates();
    if (booked.length) {
      html += '<div class="calstrip"><div><b>' + booked.length + (booked.length === 1 ? ' date booked' : ' dates booked') + '</b>' +
        '<small>Put them on your phone so you don\'t have to come back and look.</small></div>' +
        '<button type="button" class="btn small" id="addcal">Add to calendar</button></div>';
    }
    html += '<h2 class="sect">' + (st.me ? '' : '<i>2</i> &nbsp;') + headText + tally + '</h2>';
    // Days this officer already has, by topic (for "you're in X that day").
    var busyDays = {};
    if (isIS() && st.me) c.dates.forEach(function (d) { if (d['in'].some(isMe)) busyDays[d.date] = d.topic; });
    // A class with a handful of dates doesn't need a view picker; one
    // with a hundred and twenty does.
    var canPick = isIS() || c.dates.length > 2;
    html += '<div class="ctrls">';
    if (canPick) {
      if (!isIS() && sortBy === 'topic') sortBy = 'date';
      html += '<div class="viewpick"><label for="sortsel">Show</label>' +
        '<div class="viewsel"><select id="sortsel">' +
        Object.keys(SORTS).filter(function (k) { return isIS() || (k !== 'topic' && k !== 'grid'); }).map(function (k) {
          return '<option value="' + k + '"' + (sortBy === k ? ' selected' : '') + '>' + SORTS[k] + '</option>';
        }).join('') + '</select><span class="viewarr" aria-hidden="true">\u25BE</span></div></div>';
    }
    if (rota() && (canPick || c.dates.length > 1)) {
      html += '<label class="squadtog"><input type="checkbox" id="squadtog"' + (showSquads() ? ' checked' : '') +
        '> Show which squad is off</label>';
    }
    html += '</div>';
    if (!canPick && sortBy === 'cal') sortBy = isIS() ? 'topic' : 'date';
    if (sortBy === 'grid') {
      html += gridHtml(closed);
    } else if (sortBy === 'cal') {
      html += calHtml(closed, busyDays);
    } else if (isIS() && sortBy === 'date') {
      // Every date in order, each showing its topic.
      var all = c.dates.filter(function (d) { return d.date >= st.today || myStatus(d.topic).seat === d; })
        .slice().sort(function (a, b) { return (a.date + (a.start || '')).localeCompare(b.date + (b.start || '')); });
      var months = [];
      all.forEach(function (d) {
        var mon = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][+d.date.slice(5, 7) - 1];
        if (!months.length || months[months.length - 1].mon !== mon) months.push({ mon: mon, list: [] });
        months[months.length - 1].list.push(d);
      });
      months.forEach(function (m) {
        html += '<p class="daygap">' + esc(m.mon) + '</p>' +
          byDay(m.list, function (d, timeFirst) { return dateCard(d, myStatus(d.topic), closed, busyDays[d.date] && busyDays[d.date] !== d.topic ? busyDays[d.date] : '', true, timeFirst); });
      });
      if (!all.length) html += '<p class="note">No upcoming dates.</p>';
    } else groups.forEach(function (g) {
      var m = myStatus(g);
      if (isIS()) html += '<h3 class="topic">' + esc(g) + '<span class="' + (m.seat ? 'ok">' + esc(shortDay(m.seat.date)) : 'need">' + (st.me ? 'Not picked' : '')) + '</span></h3>';
      // Dates already past aren't shown (unless this officer is on one).
      var shown = c.dates.filter(function (d) { return (!isIS() || d.topic === g) && (d.date >= st.today || m.seat === d); });
      html += byDay(shown, function (d, timeFirst) { return dateCard(d, m, closed, busyDays[d.date] && busyDays[d.date] !== g ? busyDays[d.date] : '', false, timeFirst); }) ||
        '<p class="note">No upcoming dates.</p>';
    });
    html += '<div class="foot"><span>Updated ' + esc(clock(new Date())) + '</span><button type="button" class="link" id="refresh">Refresh</button></div>';
    app.innerHTML = html;
    drawWho();
  }

  // Every topic on its own line, ticked once they have a date for it.
  // Before anyone says who they are it's just the list of topics.
  function topicList(groups) {
    return '<ul class="tlist">' + groups.map(function (g) {
      var m = st.me ? myStatus(g) : null;
      var got = !!(m && m.seat);
      return '<li' + (got ? ' class="got"' : '') + '>' +
        '<span class="tmark" aria-hidden="true">' + (got ? '\u2713' : '') + '</span>' +
        '<span class="tname">' + esc(g) + '</span>' +
        (m ? '<span class="twhen">' + (got ? esc(shortDay(m.seat.date)) : m.wait ? 'Waitlisted' : 'Not picked') + '</span>' : '') +
        '</li>';
    }).join('') + '</ul>';
  }

  // One month at a time, with arrows. Six stacked calendars meant
  // scrolling past five of them to reach December.
  //
  // Days are SELECTED here, not signed up for: tap as many as you want,
  // check them over, then confirm the lot in one go.
  function calHtml(closed, busyDays) {
    var CAL_MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var CAL_DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    var c = st.cls;
    var shown = c.dates.filter(function (d) {
      return d.date >= st.today || myStatus(isIS() ? d.topic : '').seat === d;
    });
    if (!shown.length) return '<p class="note">No upcoming dates.</p>';

    var byDate = {}, mineDays = {}, byId = {};
    shown.forEach(function (d) {
      (byDate[d.date] = byDate[d.date] || []).push(d);
      byId[d.id] = d;
      if (d['in'].some(isMe)) mineDays[d.date] = true;
    });
    // Anything picked that has since gone (a refresh, someone else's
    // change) quietly drops out.
    Object.keys(calPick).forEach(function (id) { if (!byId[id]) delete calPick[id]; });

    var keys = Object.keys(byDate).sort();
    var months = [];
    keys.forEach(function (k) { var m = k.slice(0, 7); if (months.indexOf(m) < 0) months.push(m); });
    if (months.indexOf(calMonth) < 0) {
      // Open on the month holding the first date they haven't got yet.
      var want = keys.filter(function (k) { return !mineDays[k]; })[0] || keys[0];
      calMonth = want.slice(0, 7);
    }
    var mi = months.indexOf(calMonth);
    var y = +calMonth.slice(0, 4), m = +calMonth.slice(5, 7) - 1;

    var html = '<div class="calwrap"><div class="calnav">' +
      '<button type="button" id="calprev" aria-label="Previous month"' + (mi <= 0 ? ' disabled' : '') + '>&#8249;</button>' +
      '<b>' + CAL_MON[m] + ' ' + y + '</b>' +
      '<button type="button" id="calnext" aria-label="Next month"' + (mi >= months.length - 1 ? ' disabled' : '') + '>&#8250;</button>' +
      '</div><div class="calgrid">' +
      CAL_DOW.map(function (x) { return '<span class="caldow" aria-hidden="true">' + x + '</span>'; }).join('');

    var lead = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    for (var i = 0; i < lead; i++) html += '<span class="calday out"></span>';
    for (var n = 1; n <= days; n++) {
      var key = y + '-' + ('0' + (m + 1)).slice(-2) + '-' + ('0' + n).slice(-2);
      var list = byDate[key];
      if (!list) { html += '<span class="calday">' + n + '</span>'; continue; }
      var picked = list.some(function (d) { return calPick[d.id]; });
      var sq = showSquads() ? squadOff(key) : '';
      var mark = picked || mineDays[key] ? '\u2713' : sq ? sq + '-off' : list.length > 1 ? list.length : '\u00b7';
      html += '<button type="button" data-calday="' + key + '" aria-pressed="' + picked + '" aria-label="' + esc(day(key)) + '"' +
        ' class="calday has' + (mineDays[key] ? ' got' : '') + (picked ? ' pick' : '') + (calDay === key ? ' sel' : '') + '">' +
        n + '<i>' + mark + '</i></button>';
    }
    html += '</div><div class="callegend">' +
      '<span><b style="background:#E6EBF3"></b>Has a class</span>' +
      '<span><b style="background:var(--ok)"></b>Booked</span>' +
      '<span><b style="background:var(--navy)"></b>Picked</span>' +
      (showSquads() ? '<span>A-off / B-off \u2014 the squad that\'s off</span>' : '') + '</div></div>';

    // The day you tapped opens underneath: what's on it, who has already
    // signed up, and whether you've picked it. Picking a day shouldn't
    // mean giving up the one thing people check first.
    if (calDay && byDate[calDay]) {
      html += '<h3 class="topic">' + esc(day(calDay)) +
        (showSquads() && squadOff(calDay) ? '<span class="need">Squad ' + esc(squadOff(calDay)) + ' off</span>' : '') + '</h3>' +
        byDate[calDay].map(function (d) {
          var left = d.seats - d['in'].length, mineHere = d['in'].some(isMe);
          var who = d['in'].length
            ? d['in'].map(function (x) { return esc(x.n) + (isMe(x) ? ' (you)' : ''); }).join(', ')
            : 'No one yet';
          return '<button type="button" class="calpickrow' + (calPick[d.id] ? ' on' : '') + (mineHere ? ' mine' : '') +
            '" data-calsel="' + d.id + '"><span>' +
            (isIS() ? esc(d.topic) : esc(day(d.date))) +
            '<small>' + esc(times(d)) + ' \u00b7 ' + (left > 0 ? left + (left === 1 ? ' seat left' : ' seats left') : 'Full' + (d.wait.length ? ' \u00b7 ' + d.wait.length + ' waiting' : '')) + '</small>' +
            '<small class="calwho">' + who + '</small></span>' +
            '<em>' + (mineHere ? '\u2713 Booked' : calPick[d.id] ? 'Picked' : 'Pick') + '</em></button>';
        }).join('');
    }

    html += pickBar(closed, 'Tap the days you want, then confirm them together.');
    return html;
  }

  // What they've chosen and the one button that does it. Shared by the
  // calendar and the grid, so picking works the same way in both.
  function pickBar(closed, hint) {
    var byId = {};
    st.cls.dates.forEach(function (d) { byId[d.id] = d; });
    var picks = Object.keys(calPick).map(function (id) { return byId[id]; }).filter(Boolean)
      .sort(function (a, b) { return a.date.localeCompare(b.date); });
    if (!picks.length) return closed ? '' : '<p class="note">' + esc(hint) + '</p>';
    return '<div class="calbar"><b>' + picks.length + (picks.length === 1 ? ' date picked' : ' dates picked') +
      (closed ? '' : ' \u2014 not signed up yet') + '</b><ul>' +
      picks.map(function (d) {
        var was = isIS() ? myStatus(d.topic).seat : myStatus('').seat;
        return '<li>' + (isIS() ? '<span>' + esc(d.topic) + '</span>' : '') + esc(day(d.date)) +
          (was && was !== d ? ' <small>replaces ' + esc(shortDay(was.date)) + '</small>' : '') + '</li>';
      }).join('') + '</ul>' +
      (closed ? '<p class="note">' + esc(closed) + '</p>'
        : '<button type="button" class="btn" id="calgo">Sign up for ' + (picks.length === 1 ? 'this date' : 'these ' + picks.length + ' dates') + '</button>') +
      '<button type="button" class="link" id="calclear">Clear</button></div>';
  }

  // ---------- The grid ----------
  // Topics down the side, weeks across the top. The topics ladder
  // Mon/Tue/Wed and step a week at a time, so they line up into columns
  // and a whole week can be taken in one tap.

  // The Monday of the week a date falls in.
  function weekOf(key) {
    var dt = new Date(+key.slice(0, 4), +key.slice(5, 7) - 1, +key.slice(8, 10));
    dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
    return dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2) + '-' + ('0' + dt.getDate()).slice(-2);
  }

  // Everything the grid needs, or null when the dates don't make a grid.
  function gridPlan() {
    var c = st.cls;
    var rows = isIS() ? (c.topics || []) : [];
    if (!rows.length) return null;
    var shown = c.dates.filter(function (d) {
      return !d.cancelled && (d.date >= st.today || myStatus(d.topic).seat === d);
    });
    if (!shown.length) return null;
    var weeks = [], cells = {};
    shown.forEach(function (d) {
      var w = weekOf(d.date);
      if (weeks.indexOf(w) < 0) weeks.push(w);
      (cells[d.topic + '\u0000' + w] = cells[d.topic + '\u0000' + w] || []).push(d);
    });
    weeks.sort();
    // A topic with no row of its own isn't on the class: drop it.
    rows = rows.filter(function (g) { return shown.some(function (d) { return d.topic === g; }); });
    if (!rows.length) return null;
    return { rows: rows, weeks: weeks, cells: cells };
  }

  // The dates in a week this officer could still take, one per topic
  // they haven't booked or picked yet.
  function weekFree(plan, w) {
    var out = [];
    plan.rows.forEach(function (g) {
      if (myStatus(g).seat) return;
      if (Object.keys(calPick).some(function (id) {
        var x = st.cls.dates.filter(function (y) { return y.id === id; })[0];
        return x && x.topic === g;
      })) return;
      var list = plan.cells[g + '\u0000' + w] || [];
      var open = list.filter(function (d) { return d.seats - d['in'].length > 0 && !d.started && d.date >= st.today; })[0];
      if (open) out.push(open);
    });
    return out;
  }

  function gridHtml(closed) {
    var plan = gridPlan();
    if (!plan) return '<p class="note">No upcoming dates.</p>';
    var html = '<div class="gwrap"><div class="gtable" style="--gcols:' + plan.weeks.length + '">' +
      '<div class="gstick gcorner">Topic</div>';
    plan.weeks.forEach(function (w, i) {
      var free = st.me && !closed ? weekFree(plan, w) : [];
      html += '<div class="ghead">Week ' + (i + 1) + '<small>' + esc(shortDay(w)) + '</small>' +
        (st.me && !closed
          ? '<button type="button" data-gweek="' + w + '"' + (free.length ? '' : ' disabled') + '>' +
              (free.length ? 'Take week' : 'Take week') + '</button>'
          : '') + '</div>';
    });
    plan.rows.forEach(function (g) {
      var m = myStatus(g);
      var pickedHere = Object.keys(calPick).map(function (id) {
        return st.cls.dates.filter(function (y) { return y.id === id; })[0];
      }).filter(function (x) { return x && x.topic === g; })[0];
      html += '<div class="gstick grow"><b>' + esc(g) + '</b>' +
        (m.seat ? '<small class="on">\u2713 ' + esc(shortDay(m.seat.date)) + '</small>'
          : pickedHere ? '<small class="on">Picked ' + esc(shortDay(pickedHere.date)) + '</small>'
          : m.wait ? '<small>Waitlisted</small>'
          : st.me ? '<small>Not picked</small>' : '') + '</div>';
      plan.weeks.forEach(function (w) {
        var list = plan.cells[g + '\u0000' + w] || [];
        if (!list.length) { html += '<div class="gcell none" aria-hidden="true">\u2013</div>'; return; }
        var d = list[0];
        var left = d.seats - d['in'].length, mineHere = m.seat === d, waitHere = m.wait && m.wait.d === d;
        var picked = !!calPick[d.id], past = d.date < st.today || !!d.started;
        var state = mineHere ? '\u2713 Yours' : picked ? 'Picked' : waitHere ? 'Waitlist'
          : past ? 'Past' : left > 0 ? left + ' left' : 'Full';
        var sq = showSquads() ? squadOff(d.date) : '';
        html += '<button type="button" class="gcell' +
          (mineHere ? ' got' : '') + (picked ? ' pick' : '') + ((!mineHere && !picked && (left <= 0 || past)) ? ' full' : '') +
          (gridOpen === d.id ? ' sel' : '') + '" data-gcell="' + d.id + '"' +
          ' aria-pressed="' + picked + '" aria-label="' + esc(g + ', ' + day(d.date) + ', ' + state) + '">' +
          '<b>' + esc(shortDay(d.date)) + '</b><small>' + esc(state) + '</small>' +
          (list.length > 1 ? '<i>+' + (list.length - 1) + ' more</i>' : sq ? '<i>' + esc(sq) + '-off</i>' : '') +
          '</button>';
      });
    });
    html += '</div></div>';
    html += '<div class="glegend">' +
      '<span><b style="background:var(--card)"></b>Open</span>' +
      '<span><b style="background:var(--okbg);border-color:var(--ok)"></b>Yours</span>' +
      '<span><b style="background:var(--navy);border-color:var(--navy)"></b>Picked</span>' +
      '<span><b style="background:#F3F5F9"></b>Full</span>' +
      (showSquads() ? '<span>A-off / B-off \u2014 the squad that\'s off</span>' : '') + '</div>';
    if (plan.weeks.length > 2) html += '<p class="ghint">Swipe the grid sideways for later weeks. <b>Take week</b> books a whole week at once.</p>';

    // The cell you tapped opens underneath, with everything about it:
    // who's on it, the waitlist, role players, and how to drop out.
    var open = gridOpen ? st.cls.dates.filter(function (x) { return x.id === gridOpen; })[0] : null;
    if (open) {
      var busyDays = {};
      if (st.me) st.cls.dates.forEach(function (x) { if (x['in'].some(isMe)) busyDays[x.date] = x.topic; });
      // No squad chip here: each card says it below, and two sessions in
      // one week can fall on days with different squads off.
      html += '<h3 class="topic">' + esc(open.topic || day(open.date)) + '</h3>';
      (plan.cells[open.topic + '\u0000' + weekOf(open.date)] || [open]).forEach(function (d) {
        html += dateCard(d, myStatus(d.topic), closed,
          busyDays[d.date] && busyDays[d.date] !== d.topic ? busyDays[d.date] : '', false, false, !!calPick[d.id]);
      });
    }
    html += pickBar(closed, 'Tap the cells you want, then confirm them together.');
    return html;
  }

  // Tapping a day. One session that day: pick it. More than one: open
  // the day so they can say which. In-Service allows one date per topic,
  // so picking a second date for a topic replaces the first.
  function calTap(key) {
    var list = st.cls.dates.filter(function (d) {
      return d.date === key && (d.date >= st.today || myStatus(isIS() ? d.topic : '').seat === d);
    });
    if (!list.length) return;
    calDay = key;                       // always open it, so they can see who's on
    if (list.length === 1) calPickOne(list[0]);
  }

  function calPickOne(d) {
    if (calPick[d.id]) { delete calPick[d.id]; savePicks(); return; }
    if (isIS()) {
      // Only one date per topic can be waiting to be confirmed.
      Object.keys(calPick).forEach(function (id) {
        var x = st.cls.dates.filter(function (y) { return y.id === id; })[0];
        if (x && x.topic === d.topic) delete calPick[id];
      });
    }
    calPick[d.id] = true;
    savePicks();
  }

  // "A, B and C"
  function andList(a) {
    return a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  }

  // The topics they'd STILL be missing once the picked dates go through.
  function calMissingAfter() {
    if (!isIS()) return [];
    var picked = Object.keys(calPick).map(function (id) {
      return st.cls.dates.filter(function (x) { return x.id === id; })[0];
    }).filter(Boolean);
    return (st.cls.topics || []).filter(function (g) {
      if (myStatus(g).seat) return false;
      return !picked.some(function (d) { return d.topic === g; });
    });
  }

  // Signing up is the moment to say what's left, because it's the moment
  // they think they've finished. Nobody reads a count at the top of a
  // page they're scrolling past.
  function calAsk() {
    if (!Object.keys(calPick).length) return;
    if (!isIS()) { calConfirm(); return; }
    var n = Object.keys(calPick).length, left = calMissingAfter();
    var ov = $('calov');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'calov'; ov.className = 'pinov';
      ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'cal-t');
      document.body.appendChild(ov);
      ov.addEventListener('click', function (e) {
        var b = e.target.closest && e.target.closest('button');
        if (e.target === ov || (b && b.id === 'cal-keep')) { ov.hidden = true; return; }
        if (b && b.id === 'cal-go') { ov.hidden = true; calConfirm(); }
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ov.hidden) ov.hidden = true; });
    }
    var until = st.cls.deadline ? ' until <b>' + esc(day(st.cls.deadline)) + '</b>' : '';
    ov.innerHTML = '<div class="pincard">' +
      '<h2 class="pint" id="cal-t">Sign up for ' + (n === 1 ? 'this date' : 'these ' + n + ' dates') + '?</h2>' +
      (left.length
        ? '<p class="note" style="margin:0">You\'d still need <b>' + esc(andList(left)) + '</b>.</p>' +
          '<p class="note" style="margin:10px 0 0">You don\'t have to do it all now \u2014 you can come back and pick the rest any time' + until + '.</p>'
        : '<p class="note" style="margin:0">That\'s <b>all ' + (st.cls.topics || []).length + ' topics</b>. When you\'re finished, tap <b>Done</b> to save them.</p>') +
      '<div class="pinbtns"><button type="button" class="btn ghost" id="cal-keep">Keep picking</button>' +
        '<button type="button" class="btn" id="cal-go">Sign up</button></div></div>';
    ov.hidden = false;
    setTimeout(function () { var k = $('cal-go'); if (k) k.focus(); }, 50);
  }

  // In-Service doesn't email anybody, so this is where they're told where
  // their dates live - and how to keep the portal one tap away.
  function doneSaved() {
    var left = isIS() ? (st.cls.topics || []).filter(function (g) { return !myStatus(g).seat; }) : [];
    var ov = $('doneov');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'doneov'; ov.className = 'pinov';
      ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'done-t');
      document.body.appendChild(ov);
      ov.addEventListener('click', function (e) {
        var b = e.target.closest && e.target.closest('button');
        if (b && b.id === 'done-cal') { addToCalendar(); return; }
        if (e.target === ov || (b && b.id === 'done-ok')) ov.hidden = true;
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ov.hidden) ov.hidden = true; });
    }
    var purl = location.pathname.replace(/[^/]*$/, 'portal.html');
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
    var until = st.cls.deadline ? ' until <b>' + esc(day(st.cls.deadline)) + '</b>' : '';
    ov.innerHTML = '<div class="pincard">' +
      '<h2 class="pint" id="done-t">Saved</h2>' +
      '<p class="note" style="margin:0">Your dates are saved. In-Service doesn\'t send sign-up emails — ' +
        'check your dates any time on the <a href="' + purl + '">Officer Portal</a>.</p>' +
      (left.length
        ? '<p class="note" style="margin:10px 0 0;padding:10px 12px;background:#FFF4D6;color:#7A5200;border-radius:8px">' +
            'You still need <b>' + esc(andList(left)) + '</b>. You can come back and pick the rest any time' + until + '.</p>'
        : '<p class="note" style="margin:10px 0 0;padding:10px 12px;background:#E5F3EB;color:#1E7A4C;border-radius:8px">' +
            'That\'s every topic. You\'re all set.</p>') +
      (myDates().length
        ? '<div class="pinbtns" style="margin-top:12px"><button type="button" class="btn ghost" id="done-cal">' +
            'Add ' + (myDates().length === 1 ? 'the date' : 'all ' + myDates().length + ' dates') + ' to my calendar</button></div>'
        : '') +
      '<p class="note" style="margin:12px 0 0"><b>Keep it one tap away:</b> open the portal, then ' +
        (ios ? 'tap <b>Share</b> and <b>Add to Home Screen</b>.' : 'tap the <b>⋮</b> menu and <b>Add to Home screen</b>.') +
        ' It sits on your phone like an app, so you can check your dates without digging for the link.</p>' +
      '<div class="pinbtns"><button type="button" class="btn" id="done-ok">Got it</button></div></div>';
    ov.hidden = false;
    setTimeout(function () { var k = $('done-ok'); if (k) k.focus(); }, 50);
  }

  function calConfirm() {
    var ids = Object.keys(calPick);
    if (!ids.length) return;
    if (doneMe()) { toast('You\'ve already completed this training.', true); return; }
    if (!st.pin && !myPass()) { st.pinAfter = null; pinAsk(hasPin() ? 'need' : 'new', '', { op: 'calgo', d: '' }); return; }
    st.switchOk = true;
    ids.forEach(function (id) { send('join', id); });
    st.switchOk = false;
    calPick = {}; calDay = ''; savePicks();
    render();
  }

  function clock(d) { return ('0' + d.getHours()).slice(-2) + ('0' + d.getMinutes()).slice(-2); }

  // Several sessions on the same day: the day once, as a heading, then
  // each session by its time, so they don't look like repeats.
  function byDay(list, cardFn) {
    var out = '', i = 0;
    list = list.slice().sort(function (a, b) { return (a.date + (a.start || '')).localeCompare(b.date + (b.start || '')); });
    while (i < list.length) {
      var j = i; while (j < list.length && list[j].date === list[i].date) j++;
      if (j - i > 1) {
        out += '<div class="dayhead"><b>' + esc(day(list[i].date)) + '</b><span>' + (j - i) + ' sessions · pick one</span></div>';
        for (var k = i; k < j; k++) out += cardFn(list[k], true);
      } else out += cardFn(list[i], false);
      i = j;
    }
    return out;
  }
  function partOfDay(d) {
    var h = +String(d.start || '').slice(0, 2);
    if (!d.start) return '';
    return h < 5 ? 'Overnight' : h < 11 ? 'Morning' : h < 14 ? 'Midday' : h < 17 ? 'Afternoon' : 'Evening';
  }
  // noJoin: this date is already in the batch waiting to be confirmed, so
  // the card doesn't offer a second, separate "Sign up" button.
  function dateCard(d, mine, closed, also, showTopic, timeFirst, noJoin) {
    var taken = d['in'].length, left = d.seats - taken, past = d.date < st.today || !!d.started;
    var seatHere = mine.seat === d, waitHere = mine.wait && mine.wait.d === d;
    if (d.cancelled) {
      return '<div class="card date" style="opacity:.8"><div class="dhead"><div>' + (showTopic ? '<p class="dtopic"><em>' + esc(d.topic) + '</em></p>' : '') +
        '<b><s>' + esc(timeFirst ? (d.start ? d.start + (d.end ? '–' + d.end : '') : 'Session') : day(d.date)) + '</s></b><small>' + esc([times(d), d.location].filter(Boolean).join(' · ')) + '</small></div>' +
        '<span class="seats full">Cancelled</span></div><p class="note" style="margin:0 16px 14px">This date was cancelled.' +
        (st.me && !closed ? ' Pick another date.' : '') + '</p></div>';
    }
    var chip = past ? '<span class="seats past">' + (d.date < st.today ? 'Past' : 'Started') + '</span>'
      : left <= 0 ? '<span class="seats full">Full' + (d.wait.length ? ' · ' + d.wait.length + ' waiting' : '') + '</span>'
      : d.wait.length ? '<span class="seats">' + left + (left === 1 ? ' seat' : ' seats') + ' open · for the waitlist</span>'
      : '<span class="seats">' + left + (left === 1 ? ' seat' : ' seats') + ' left</span>';
    var html = '<div class="card date' + (seatHere ? ' me' : waitHere ? ' mewait' : '') + '">' +
      '<div class="dhead"><div>' +
        (showTopic ? '<p class="dtopic"><em>' + esc(d.topic) + '</em>' +
          (mine.seat && mine.seat !== d ? '<span class="have">\u2713 You have it ' + esc(shortDay(mine.seat.date)) + '</span>' : '') + '</p>' : '') +
        (timeFirst
          ? '<b class="tbig">' + esc(d.start ? d.start + (d.end ? '–' + d.end : '') : 'Session') + '</b><small>' + esc([partOfDay(d), d.location].filter(Boolean).join(' · '))
          : '<b>' + esc(day(d.date)) + '</b><small>' + esc([times(d), d.location].filter(Boolean).join(' · '))) +
        '</small><small>' + taken + ' of ' + d.seats + ' signed up</small>' +
        (showSquads() && squadOff(d.date) ? '<small class="squadoff">Squad ' + esc(squadOff(d.date)) + ' is off</small>' : '') +
        (also && !seatHere ? '<small style="color:var(--wait);font-weight:700">You\'re in ' + esc(also) + ' that day.</small>' : '') + '</div>' + chip + '</div>' +
      '<div class="bar"><i style="width:' + Math.min(100, Math.round(taken / d.seats * 100)) + '%"></i></div>';

    html += '<ul class="who">' + (taken ? d['in'].map(function (x) {
      return '<li' + (isMe(x) ? ' class="you"' : '') + '><span class="cs">' + esc(x.c || '·') + '</span>' + esc(x.n) + (isMe(x) ? ' (you)' : '') + '</li>';
    }).join('') : '<li class="open">No one yet</li>') + '</ul>';
    if (d.wait.length) {
      html += '<p class="wl">Waitlist</p><ul class="who">' + d.wait.map(function (x, i) {
        return '<li class="w' + (isMe(x) ? ' you' : '') + '"><span class="cs">' + (i + 1) + '</span>' + esc(x.n) + (x.c ? ' · ' + esc(x.c) : '') + (isMe(x) ? ' (you)' : '') + '</li>';
      }).join('') + '</ul>';
    }

    // Buttons, for the person picked, while sign-ups are open.
    var rpNow = hasRp() && st.me ? rpOf(d) : { seat: false, wait: -1 };
    if (st.me && !closed && !past && doneMe() && !seatHere && !waitHere) {
      if (!(rpNow.seat || rpNow.wait >= 0)) html += '<div class="acts"><span class="donote">You\'ve already taken this training.' + ((d.rpSeats || 0) > 0 ? ' Sign up as a role player below.' : '') + '</span></div>';
      else html += '<div style="height:4px"></div>';
    } else if (st.me && !closed && !past && (rpNow.seat || rpNow.wait >= 0) && !seatHere && !waitHere) {
      html += '<div class="acts"><span class="donote">You\'re a role player this date, so you can\'t also attend it.</span></div>';
    } else if (st.me && !closed && !past) {
      var busy = false;
      var b = '';
      var confirmKey = function (op) { return op + '|' + d.id; };
      if (seatHere) {
        b = '<span class="state ok">You\'re signed up for this date.</span>' +
          (st.confirm === confirmKey('drop')
            ? '<button type="button" class="btn warn" data-op="drop" data-d="' + d.id + '"' + (busy ? ' disabled' : '') + '>Tap again to drop out</button>'
            : '<div class="actrow">' +
                '<button type="button" class="btn ghost" data-cal1="' + d.id + '">Add to my calendar</button>' +
                '<button type="button" class="drop-link" data-op="drop" data-d="' + d.id + '">Drop out</button></div>');
      } else if (waitHere && left > 0) {
        // A seat opened: the first one on the waitlist to claim it gets it.
        b = '<span class="state ok" style="flex:1 1 100%">A seat is open! The first person on the waitlist to claim it gets it.</span>' +
          '<button type="button" class="btn" data-op="join" data-d="' + d.id + '"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Saving…' : 'Claim this seat') + '</button>' +
          (mine.seat ? '<span class="note" style="flex:1 1 100%">Claiming it moves you from ' + esc(shortDay(mine.seat.date)) + '.</span>' : '') +
          '<button type="button" class="drop-link" data-op="unwait" data-d="' + d.id + '">Leave the waitlist</button>';
      } else if (waitHere) {
        b = '<span class="state wait">You\'re #' + mine.wait.pos + ' on the waitlist. If a seat opens, everyone on the waitlist gets an email, and the first to claim it gets it' + (mine.seat ? ' (you\'d give up ' + esc(shortDay(mine.seat.date)) + ')' : '') + '.</span>' +
          '<button type="button" class="drop-link" data-op="unwait" data-d="' + d.id + '">Leave the waitlist</button>';
      } else if (left > 0 && d.wait.length) {
        b = '<span class="note" style="flex:1 1 100%">A seat is open, but it\'s held for the people on the waitlist.</span>' +
          '<button type="button" class="btn ghost" data-op="wait" data-d="' + d.id + '"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Saving…' : 'Join the waitlist') + '</button>';
      } else if (left > 0 && noJoin) {
        b = '<span class="state ok">Picked. Confirm it below.</span>';
      } else if (left > 0) {
        var sw = !!mine.seat;
        b = '<button type="button" class="btn' + (sw ? ' ghost' : '') + '" data-op="join" data-d="' + d.id + '"' + (busy ? ' disabled' : '') + '>' +
              (busy ? 'Saving…' : (sw ? 'Switch to this ' : 'Sign up for this ') + (timeFirst ? 'time' : 'date')) + '</button>';
      } else {
        b = '<button type="button" class="btn ghost" data-op="wait" data-d="' + d.id + '"' + (busy ? ' disabled' : '') + '>' +
          (busy ? 'Saving…' : 'Join the waitlist') + '</button>' +
          (mine.seat ? '<span class="note" style="flex:1 1 100%">You keep ' + esc(shortDay(mine.seat.date)) + ' until a seat opens here.</span>' : '');
      }
      html += '<div class="acts">' + b + '</div>';
    } else {
      html += '<div style="height:8px"></div>';
    }
    if (hasRp() && (d.rpSeats || 0) > 0) html += rpBox(d, closed, past, seatHere, waitHere);
    return html + '</div>';
  }

  // The role-player part of a date card.
  function rpBox(d, closed, past, seatHere, waitHere) {
    var list = d.rp || [], wl = d.rpWait || [], n = d.rpSeats || 0, left = n - list.length, me = rpOf(d);
    var h = '<div class="rpbox' + (me.seat ? ' me' : '') + '"><div class="rphead">Role players' +
      '<span class="' + (left <= 0 ? 'full' : '') + '">' + list.length + ' of ' + n + (left <= 0 ? ' · Full' + (wl.length ? ', ' + wl.length + ' waiting' : '') : '') + '</span></div>' +
      '<ul class="who">' + (list.length ? list.map(function (x) {
        return '<li' + (isMe(x) ? ' class="you"' : '') + '><span class="cs">' + esc(x.c || '·') + '</span>' + esc(x.n) + (isMe(x) ? ' (you)' : '') + '</li>';
      }).join('') : '<li class="open">No role players yet</li>') +
