      wl.map(function (x, i) { return '<li class="w' + (isMe(x) ? ' you' : '') + '"><span class="cs">W' + (i + 1) + '</span>' + esc(x.n) + (isMe(x) ? ' (you)' : '') + '</li>'; }).join('') + '</ul>';
    if (st.me && !closed && !past) {
      var b = '';
      if (me.seat) {
        b = '<span class="state ok">You\'re a role player for this date.</span>' +
          (st.confirm === 'rpdrop|' + d.id
            ? '<button type="button" class="btn warn" data-op="rpdrop" data-d="' + d.id + '">Tap again to drop out</button>'
            : '<button type="button" class="drop-link" data-op="rpdrop" data-d="' + d.id + '">Drop out as a role player</button>');
      } else if (me.wait >= 0) {
        b = '<span class="state wait">You\'re #' + (me.wait + 1) + ' on the role-player waitlist.</span>' +
          '<button type="button" class="drop-link" data-op="rpunwait" data-d="' + d.id + '">Leave the waitlist</button>';
      } else if (seatHere) {
        b = '';
      } else if (left > 0) {
        b = '<button type="button" class="btn ghost" data-op="rpjoin" data-d="' + d.id + '">Sign up as a role player</button>' +
          (waitHere ? '<span class="note" style="flex:1 1 100%">You\'ll leave the attendee waitlist for this date.</span>' : '');
      } else {
        b = '<button type="button" class="btn ghost" data-op="rpwait" data-d="' + d.id + '">Join the role-player waitlist</button>';
      }
      if (b) h += '<div class="acts">' + b + '</div>';
    }
    return h + '</div><div style="height:12px"></div>';
  }

  // ---------- Who are you ----------

  function drawWho() {
    var box = $('who');
    if (!box) return;
    if (st.me) {
      var p = st.me;
      box.innerHTML = '<div class="picked"><div><b>' + esc(p.name) + '</b><small>' + esc([p.rank, p.call].filter(Boolean).join(' · ')) + '</small></div>' +
        '<button type="button" class="link" id="change">Not you?</button></div>' +
        '<p class="note" style="margin:8px 2px 0">' + (myPass()
          ? 'This phone remembers your PIN. <button type="button" class="link" id="forget" style="padding:0">Forget it</button>'
          : hasPin() ? 'You\'ll enter your PIN to sign up or make changes.'
          : 'The first time you sign up, you\'ll give your email and make up a PIN.') + '</p>';
      return;
    }
    box.innerHTML = '<div class="find">' +
        '<input type="text" id="q" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" ' +
          'placeholder="Type your last name or call sign" aria-label="Your name" aria-autocomplete="list" aria-controls="drop">' +
        '<ul class="drop" id="drop" role="listbox" hidden></ul></div>' +
      '<p class="note" style="margin:8px 2px 0">Pick your name to sign up. Not in the list? See the training officer.</p>';
  }

  function search(q) {
    var parts = q.toLowerCase().split(/[\s.,]+/).filter(Boolean);
    if (!parts.length) return [];
    return PEOPLE.filter(function (p) {
      var call = p.call.toLowerCase();
      return parts.every(function (w) {
        return (call && call.indexOf(w) === 0) || p.words.some(function (x) { return x.indexOf(w) === 0; });
      });
    }).slice(0, 6);
  }

  function drawDrop() {
    var drop = $('drop'), q = $('q').value.trim();
    st.matches = search(q);
    if (!q) { drop.hidden = true; drop.innerHTML = ''; return; }
    drop.innerHTML = st.matches.length
      ? st.matches.map(function (p, i) {
          return '<li><button type="button" role="option" data-pick="' + i + '"><span>' + esc(p.name) + '</span><small>' +
            esc([p.rank, p.call].filter(Boolean).join(' · ')) + '</small></button></li>';
        }).join('')
      : '<li class="none">No match. Check the spelling, or see the training officer.</li>';
    drop.hidden = false;
  }

  function choose(i) {
    var p = st.matches[i];
    if (!p) return;
    st.me = p;
    store.set(meKey, JSON.stringify({ name: p.name, call: p.call }));
    store.set('ci-class-me', JSON.stringify({ name: p.name, call: p.call }));
    loadPicks();
    render();
  }

  // ---------- Signing up ----------

  var toastTimer = null;
  function toast(msg, bad) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (bad ? ' bad' : '');
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, bad ? 6000 : 3500);
  }

  function act(op, dateId) {
    var dd = st.cls.dates.filter(function (x) { return x.id === dateId; })[0] || {};
    var mine = myStatus(isIS() ? dd.topic : '');
    // Switching away from a seat: a pop-up asks first.
    if (op === 'join' && mine.seat && mine.seat !== dd && !st.switchOk) { switchAsk(mine.seat, dd); return; }
    if ((op === 'join' || op === 'wait') && doneMe()) { toast('You\'ve already completed this training. You can sign up as a role player instead.', true); return; }
    st.switchOk = false;
    // Dropping out takes a second tap.
    var needs = op === 'drop' || op === 'rpdrop';
    if (needs && st.confirm !== op + '|' + dateId) {
      st.confirm = op + '|' + dateId;
      clearTimeout(st.confirmTimer);
      st.confirmTimer = setTimeout(function () { st.confirm = ''; render(); }, 5000);
      render();
      return;
    }
    st.confirm = '';
    // In-Service: the officer's PIN goes with every change. Ask for it
    // (or for an email and a new PIN, the first time) before sending.
    if (!st.pin && !myPass()) { pinAsk(hasPin() ? 'need' : 'new', '', { op: op, d: dateId }); return; }
    send(op, dateId);
  }

  function hasPin() {
    if (!st.me) return false;
    var set = st.cls.pinSet || [];
    if (set.indexOf(st.me.name + '|' + st.me.call) >= 0) return true;
    var cs = String(st.me.call || '').toUpperCase();
    return !!cs && set.some(function (k) { return k.slice(k.lastIndexOf('|') + 1).toUpperCase() === cs; });
  }

  // This phone's remembered pass for each officer (instead of the PIN).
  function passes() { try { return JSON.parse(store.get('ci-pass') || '{}') || {}; } catch (e) { return {}; } }
  function myPass() {
    if (!st.me) return '';
    var all = passes(), hit = all[st.me.name + '|' + st.me.call];
    if (hit) return hit;
    // Saved under their old name (changed in the Directory): same call sign.
    var cs = String(st.me.call || '').toUpperCase();
    var k = cs && Object.keys(all).filter(function (x) { return x.slice(x.lastIndexOf('|') + 1).toUpperCase() === cs; })[0];
    return k ? all[k] : '';
  }
  function savePass(token) {
    var all = passes(), k = st.me.name + '|' + st.me.call;
    if (token) all[k] = token; else delete all[k];
    store.set('ci-pass', JSON.stringify(all));
  }

  // ---------- Instant changes ----------
  // A tap changes the page right away; the saves go to the server one
  // after another in the background. When the last one comes back, the
  // page takes the server's lists (which have anything others did too).
  // If one is refused, the page goes back to the server's lists and says why.
  st.queue = []; st.sending = false;

  function send(op, dateId) {
    if (op === 'done') { st.finishing = true; st.queue.push({ op: op, d: '', tries: 0 }); drawDone(); pump(); return; }
    applyLocal(op, dateId);
    setDirty(true);
    st.queue.push({ op: op, d: dateId, tries: 0 });
    render();
    toast(localMessage(op, dateId));
    pump();
  }

  function meOf() { return { n: st.me.name, c: st.me.call }; }
  function same(x) { return samePerson(x, st.me); }

  function applyLocal(op, dateId) {
    var d = st.cls.dates.filter(function (x) { return x.id === dateId; })[0];
    if (!d) return;
    var inGroup = function (x) { return !isIS() || x.topic === d.topic; };
    if (op === 'join') {
      st.cls.dates.forEach(function (x) { if (inGroup(x) && x.date >= st.today) x['in'] = x['in'].filter(function (y) { return !same(y); }); });
      d.wait = d.wait.filter(function (y) { return !same(y); });
      d['in'].push(meOf());
    } else if (op === 'wait') {
      st.cls.dates.forEach(function (x) { if (inGroup(x)) x.wait = x.wait.filter(function (y) { return !same(y); }); });
      d.wait.push(meOf());
    } else if (op === 'drop') {
      d['in'] = d['in'].filter(function (y) { return !same(y); });
      if (d.wait.length && d['in'].length < d.seats) d['in'].push(d.wait.shift()); // first on the waitlist moves in
    } else if (op === 'unwait') {
      d.wait = d.wait.filter(function (y) { return !same(y); });
    } else if (op === 'rpjoin' || op === 'rpwait') {
      d.rp = (d.rp || []).filter(function (y) { return !same(y); });
      d.rpWait = (d.rpWait || []).filter(function (y) { return !same(y); });
      d.wait = d.wait.filter(function (y) { return !same(y); });
      if (op === 'rpjoin') d.rp.push(meOf()); else d.rpWait.push(meOf());
    } else if (op === 'rpdrop') {
      d.rp = (d.rp || []).filter(function (y) { return !same(y); });
      if ((d.rpWait || []).length && d.rp.length < (d.rpSeats || 0)) d.rp.push(d.rpWait.shift());
    } else if (op === 'rpunwait') {
      d.rpWait = (d.rpWait || []).filter(function (y) { return !same(y); });
    }
    // Attending a date: no longer a role player that day.
    if (op === 'join' || op === 'wait') {
      d.rp = (d.rp || []).filter(function (y) { return !same(y); });
      d.rpWait = (d.rpWait || []).filter(function (y) { return !same(y); });
    }
    // In-Service: once they've given a PIN, the page knows they have one.
    if (st.pin && !hasPin()) (st.cls.pinSet = st.cls.pinSet || []).push(st.me.name + '|' + st.me.call);
  }

  function localMessage(op, dateId) {
    var d = st.cls.dates.filter(function (x) { return x.id === dateId; })[0] || {};
    var what = (d.topic ? d.topic + ', ' : '') + shortDay(d.date) + (times(d) ? ' ' + times(d) : '');
    return op === 'join' ? 'Signed up for ' + what + '.'
      : op === 'wait' ? 'On the waitlist for ' + what + '.'
      : op === 'drop' ? 'Dropped out of ' + what + '.'
      : op === 'rpjoin' ? 'Signed up as a role player for ' + what + '.'
      : op === 'rpwait' ? 'On the role-player waitlist for ' + what + '.'
      : op === 'rpdrop' ? 'No longer a role player for ' + what + '.'
      : op === 'rpunwait' ? 'Left the role-player waitlist for ' + what + '.'
      : 'Left the waitlist for ' + what + '.';
  }

  function pump() {
    savingBadge();
    if (st.sending || !st.queue.length) return;
    var j = st.queue[0];
    st.sending = true;
    google.script.run
      .withSuccessHandler(function (res) {
        st.sending = false;
        st.queue.shift();
        if (res && res.gone) { st.queue = []; savingBadge(); stop('Class sign-up', res.message); return; }
        if (j.op === 'done') st.finishing = false;
        if (!res || !res.ok) {
          // Refused: show the real lists and say why. Later taps are dropped.
          st.queue = [];
          if (res && res.cls) { st.cls = res.cls; st.today = res.today || st.today; } else refresh(true);
          render();
          savingBadge();
          if (res && res.pin) {
            // The PIN or this phone's pass didn't work (maybe it was reset): ask again.
            st.pin = ''; st.email = ''; savePass('');
            pinAsk(res.pin, res.pin === 'need' && !res.message ? '' : res.message, { op: j.op, d: j.d });
            render();
            return;
          }
          toast((res && res.message) || 'That didn\'t save. Try again.', true);
          return;
        }
        // A right PIN: this phone remembers it from now on.
        if (res.token) { savePass(res.token); st.pin = ''; st.email = ''; }
        var saved = false;
        if (j.op === 'done') {
          setDirty(false); drawDone();
          if (isIS() || (res && res.noEmail)) saved = true; else toast(res.message || 'Done!');
        }
        if (!st.queue.length) {
          st.cls = res.cls; st.today = res.today || st.today;
          if (!(document.activeElement && document.activeElement.id === 'q')) render();
        }
        // After the fresh class lands, so "you still need" is up to date.
        if (saved) doneSaved();
        pump();
      })
      .withFailureHandler(function () {
        st.sending = false;
        if (j.op === 'done' && j.tries >= 2) { st.finishing = false; drawDone(); }
        // No answer (signal dropped): try again a couple of times.
        if (j.tries < 2) { j.tries++; savingBadge(true); setTimeout(pump, 1500 * j.tries); return; }
        st.queue = [];
        savingBadge();
        refresh(true);
        toast('That didn\'t save (no connection). Check your signal and tap again.', true);
      })
      .ciClassSignup({ c: DATA.c, k: DATA.k, person: { name: st.me.name, call: st.me.call }, d: j.d, op: j.op, device: device,
        pin: st.pin || '', email: st.email || '', token: st.pin ? '' : myPass() });
  }

  var badgeTimer = null;
  function savingBadge(retrying) {
    var el = $('saving');
    if (!el) {
      el = document.createElement('div');
      el.id = 'saving'; el.className = 'saving'; el.hidden = true;
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    clearTimeout(badgeTimer);
    if (st.queue.length) {
      el.hidden = false;
      el.className = 'saving' + (retrying ? ' retry' : '');
      el.textContent = retrying ? 'Reconnecting…' : 'Saving…';
    } else if (!el.hidden) {
      el.className = 'saving done';
      el.textContent = 'Saved';
      badgeTimer = setTimeout(function () { el.hidden = true; }, 1500);
    }
  }

  // Leaving while something is still saving asks first.
  window.addEventListener('beforeunload', function (e) {
    if (st.queue.length) { e.preventDefault(); e.returnValue = ''; }
  });

  // ---------- Are you sure you want to switch? ----------
  function switchAsk(from, to) {
    var ov = $('swov');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'swov'; ov.className = 'pinov';
      ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'sw-t');
      document.body.appendChild(ov);
      ov.addEventListener('click', function (e) {
        var b = e.target.closest && e.target.closest('button');
        if (e.target === ov || (b && b.id === 'sw-keep')) { ov.hidden = true; render(); return; }
        if (b && b.id === 'sw-go') { ov.hidden = true; st.switchOk = true; act('join', ov.dataset.d); }
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ov.hidden) { ov.hidden = true; render(); } });
    }
    var when = function (d) { return shortDay(d.date) + (times(d) ? ' ' + times(d) : ''); };
    var what = isIS() ? esc(to.topic) : 'your date';
    ov.dataset.d = to.id;
    ov.innerHTML = '<div class="pincard">' +
      '<h2 class="pint" id="sw-t">Switch ' + what + '?</h2>' +
      '<p class="swfrom">From <s>' + esc(when(from)) + '</s><br>To <b>' + esc(when(to)) + '</b></p>' +
      '<p class="note" style="margin:10px 0 0">You\'ll give up your seat on ' + esc(shortDay(from.date)) + ', and someone else can take it.</p>' +
      '<div class="pinbtns"><button type="button" class="btn ghost" id="sw-keep">Keep ' + esc(shortDay(from.date)) + '</button>' +
        '<button type="button" class="btn" id="sw-go">Switch</button></div></div>';
    ov.hidden = false;
    setTimeout(function () { var k = $('sw-keep'); if (k) k.focus(); }, 50);
  }

  // ---------- In-Service PIN ----------
  // mode: new (email + make up a PIN), need / wrong (enter the PIN),
  // locked (too many tries). after = the change to send once it's in.
  function pinAsk(mode, message, after) {
    var ov = $('pinov');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'pinov'; ov.className = 'pinov';
      ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
      document.body.appendChild(ov);
      ov.addEventListener('click', function (e) {
        var b = e.target.closest && e.target.closest('button');
        if (e.target === ov || (b && b.id === 'pin-cancel')) { ov.hidden = true; return; }
        if (b && b.id === 'pin-forgot') { forgotAsk(); return; }
        if (b && b.id === 'pin-nosend') { var m0 = $('pin-forgot-msg'); if (m0) { m0.hidden = true; m0.innerHTML = ''; } var fb = $('pin-forgot'); if (fb) fb.hidden = false; return; }
        if (b && b.id === 'pin-send') { forgotPin(); return; }
        if (b && b.id === 'pin-go') pinSubmit();
      });
      ov.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); pinSubmit(); } });
      ov.addEventListener('input', function (e) {
        if (e.target.dataset && e.target.dataset.digits != null) { var v = e.target.value.replace(/\D/g, '').slice(0, 4); if (v !== e.target.value) e.target.value = v; }
        $('pin-err').textContent = '';
      });
    }
    st.pinMode = mode; st.pinAfter = after;
    var isNew = mode === 'new';
    var pinBox = function (id, label) {
      return '<label class="pinf"><span>' + label + '</span><input id="' + id + '" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" data-digits></label>';
    };
    ov.innerHTML = '<div class="pincard">' +
      (isNew
        ? '<h2 class="pint">Set up your sign-ups</h2><p class="note">Make up a 4-digit PIN. It\'s one PIN for all your class sign-ups: ' +
            'you\'ll use it to sign up or make changes from any phone or computer. This phone will remember it. ' +
            'You\'ll get an email when you sign up or make a change, with an "add to calendar" link, and a reminder the day before.</p>' +
          '<label class="pinf"><span>Email</span><input id="pin-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com"></label>' +
          pinBox('pin-1', 'Make up a PIN (4 numbers)') + pinBox('pin-2', 'Type the PIN again')
        : '<h2 class="pint">Enter your PIN</h2><p class="note">The 4-digit PIN you made the first time you signed up for a class. This phone will remember it.</p>' +
          pinBox('pin-1', 'PIN')) +
      '<p class="pin-err" id="pin-err" role="alert">' + esc(mode === 'new' && !message ? '' : message || '') + '</p>' +
      (isNew ? '' : '<button type="button" class="link" id="pin-forgot">Forgot your PIN? Email me a temporary PIN</button>' +
        '<p class="note" id="pin-forgot-msg" hidden>' + (mode === 'locked' ? 'Tap the link above for a temporary PIN by email, or wait 15 minutes.' : '') + '</p>') +
      '<div class="pinbtns"><button type="button" class="btn ghost" id="pin-cancel">Cancel</button>' +
        '<button type="button" class="btn" id="pin-go"' + (mode === 'locked' ? ' disabled' : '') + '>' + (isNew ? 'Save and sign up' : 'Continue') + '</button></div>' +
      '</div>';
    if (mode === 'locked') $('pin-forgot-msg').hidden = false;
    ov.hidden = false;
    var first = $(isNew ? 'pin-email' : 'pin-1');
    if (first) setTimeout(function () { first.focus(); }, 50);
  }

  // Asking for a code shouldn't fire one off on the tap. Say which
  // address it's going to and let them think again - an officer who
  // doesn't read that mailbox needs to know before they sit waiting.
  function forgotAsk() {
    var msg = $('pin-forgot-msg'), btn = $('pin-forgot');
    if (!msg || !st.me) return;
    if (btn) btn.hidden = true;
    msg.hidden = false;
    msg.textContent = 'Checking where to send it\u2026';
    api('pinWhere', { name: st.me.name, call: st.me.call }).then(function (res) {
      if (res && res.ok && res.masked) {
        msg.innerHTML = 'Send a temporary PIN to <b>' + esc(res.masked) + '</b>?' +
          '<span class="pinconf"><button type="button" class="btn ghost" id="pin-nosend">Cancel</button>' +
          '<button type="button" class="btn" id="pin-send">Send it</button></span>';
      } else if (res && res.none) {
        msg.innerHTML = esc(res.message || 'We have no email for you.');
      } else {
        msg.innerHTML = esc((res && res.message) || 'That didn\'t work.') + ' <b>Contact the training coordinator.</b>';
        if (btn) btn.hidden = false;
      }
    }, function () {
      msg.textContent = 'Couldn\'t reach the training system. Check your signal.';
      if (btn) btn.hidden = false;
    });
  }

  // Forgot the PIN: a temporary one goes to the Employee Directory email.
  function forgotPin() {
    var msg = $('pin-forgot-msg'), btn = $('pin-forgot');
    if (!msg || !st.me) return;
    if (btn) btn.disabled = true;
    msg.hidden = false; msg.textContent = 'Sending…';
    api('pinForgot', { name: st.me.name, call: st.me.call }).then(function (res) {
      if (btn) { btn.disabled = false; btn.hidden = !(res && res.ok); }
      msg.innerHTML = esc((res && res.message) || 'That didn\'t work.') + (res && res.ok ? ' <b>Type it in above.</b>' : res && res.none ? '' : ' <b>Or contact the training coordinator.</b>');
      // A locked screen can take the temporary PIN.
      if (res && res.ok && st.pinMode === 'locked') { st.pinMode = 'need'; $('pin-go').disabled = false; var p = $('pin-1'); if (p) p.focus(); }
    }, function () {
      if (btn) { btn.disabled = false; btn.hidden = false; }
      msg.textContent = 'Couldn\'t reach the training system. Check your signal, or contact the training coordinator.';
    });
  }

  function pinSubmit() {
    if (st.pinMode === 'locked') return;
    var err = $('pin-err'), p1 = ($('pin-1').value || '').trim();
    if (st.pinMode === 'new') {
      var email = ($('pin-email').value || '').trim();
      if (!/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(email)) { err.textContent = 'Enter a good email address.'; return; }
      if (!/^\d{4}$/.test(p1)) { err.textContent = 'Your PIN should be 4 numbers.'; return; }
      if (p1 !== ($('pin-2').value || '').trim()) { err.textContent = 'The two PINs don\'t match. Type them again.'; return; }
      st.email = email;
    } else if (!/^\d{4}$/.test(p1)) { err.textContent = 'Enter your 4-number PIN.'; return; }
    st.pin = p1;
    $('pinov').hidden = true;
    if (st.pinAfter && st.pinAfter.op === 'calgo') calConfirm();
    else if (st.pinAfter) send(st.pinAfter.op, st.pinAfter.d);
    st.pinAfter = null;
  }

  var refreshing = false;
  // Tapping Refresh used to look like nothing happened: no change to the
  // button while it worked, then "Up to date", which reads like a brush-off
  // rather than an answer. And every one of the early exits dropped out
  // silently, so a tap during a save did nothing at all.
  function refresh(quiet) {
    if (refreshing) return;
    if (st.sending || st.queue.length) { if (!quiet) toast('Still saving your last change \u2014 one moment.'); return; }
    refreshing = true;
    var btn = $('refresh');
    if (btn && !quiet) { btn.disabled = true; btn.textContent = 'Checking\u2026'; }
    var done = function (msg, bad) {
      refreshing = false;
      var b2 = $('refresh');
      if (b2) { b2.disabled = false; b2.textContent = 'Refresh'; }
      if (!quiet && msg) toast(msg, bad);
    };
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.gone) { refreshing = false; stop('Class sign-up', res.message); return; }
        if (!res || !res.ok) { done('Couldn\'t refresh. Try again in a moment.', true); return; }
        if (st.sending || st.queue.length) { done(''); return; }
        // Say whether anything actually moved, so a quick answer doesn't
        // look like a refusal to check.
        var before = JSON.stringify(st.cls.dates || []);
        st.cls = res.cls; st.today = res.today || st.today; if (res.done) st.done = res.done;
        var changed = JSON.stringify(st.cls.dates || []) !== before;
        // Don't redraw under someone typing their name.
        if (!(document.activeElement && document.activeElement.id === 'q')) render();
        done(changed ? 'Updated \u2014 something changed.' : 'Checked. Nothing new.');
      })
      .withFailureHandler(function () { done('Couldn\'t refresh. Check your signal.', true); })
      .ciClassState({ c: DATA.c, k: DATA.k });
  }

  // Keeps the lists current while the page is open.
  setInterval(function () { if (!document.hidden) refresh(true); }, 45000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(true); });

  app.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button');
    if (!b) return;
    if (b.dataset.pick != null) { choose(+b.dataset.pick); return; }
    if (b.id === 'change') { st.me = null; calPick = {}; gridOpen = ''; drawDone(); st.confirm = ''; st.pin = ''; st.email = ''; store.set(meKey, ''); store.set('ci-class-me', ''); render(); var q = $('q'); if (q) q.focus(); return; }
    if (b.id === 'refresh') { refresh(false); return; }
    if (b.id === 'addcal') { addToCalendar(); return; }
    if (b.dataset.cal1) {
      var one = st.cls.dates.filter(function (x) { return x.id === b.dataset.cal1; })[0];
      if (one) addToCalendar([one]);
      return;
    }
    if (b.id === 'forget') { savePass(''); st.pin = ''; render(); toast('This phone forgot your PIN.'); return; }
    if (b.dataset.op) { act(b.dataset.op, b.dataset.d); return; }
    if (b.dataset.calday) { calTap(b.dataset.calday); render(); return; }
    if (b.dataset.calsel) {
      var dsel = st.cls.dates.filter(function (x) { return x.id === b.dataset.calsel; })[0];
      if (dsel) { calPickOne(dsel); render(); }
      return;
    }
    if (b.id === 'calprev' || b.id === 'calnext') {
      var ym = calMonth.split('-'), yy = +ym[0], mm = +ym[1] - 1 + (b.id === 'calnext' ? 1 : -1);
      if (mm < 0) { mm = 11; yy--; } else if (mm > 11) { mm = 0; yy++; }
      calMonth = yy + '-' + ('0' + (mm + 1)).slice(-2); calDay = ''; render(); return;
    }
    if (b.dataset.gcell) {
      var gd = st.cls.dates.filter(function (x) { return x.id === b.dataset.gcell; })[0];
      if (gd) {
        gridOpen = gd.id;
        var gLeft = gd.seats - gd['in'].length, gMine = myStatus(gd.topic).seat === gd;
        var gPast = gd.date < st.today || !!gd.started;
        // A free seat is picked as well as opened. A full one just opens,
        // so they can join its waitlist from the card underneath.
        if (st.me && !closedReason() && !gMine && !gPast && (gLeft > 0 || calPick[gd.id])) calPickOne(gd);
        render();
      }
      return;
    }
    if (b.dataset.gweek) {
      var plan = gridPlan();
      if (plan) {
        var free = weekFree(plan, b.dataset.gweek);
        free.forEach(function (d) { calPickOne(d); });
        savePicks();
        gridOpen = '';
        render();
        toast(free.length ? 'Picked ' + free.length + (free.length === 1 ? ' date' : ' dates') + ' that week. Confirm below.'
          : 'Nothing left to pick that week.', !free.length);
      }
      return;
    }
    if (b.id === 'calgo') { calAsk(); return; }
    if (b.id === 'calclear') { calPick = {}; calDay = ''; gridOpen = ''; savePicks(); render(); return; }
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'squadtog') { store.set('ci-class-squads', e.target.checked ? 'on' : 'off'); render(); return; }
    if (e.target.id !== 'sortsel') return;
    sortBy = e.target.value; store.set('ci-class-sort', sortBy); gridOpen = ''; calDay = ''; render();
  });
  app.addEventListener('input', function (e) { if (e.target.id === 'q') drawDrop(); });
  app.addEventListener('keydown', function (e) {
    if (e.target.id !== 'q') return;
    if (e.key === 'Enter' && st.matches.length) { e.preventDefault(); choose(0); }
    if (e.key === 'Escape') { $('drop').hidden = true; }
  });
  document.addEventListener('click', function (e) {
    var drop = $('drop');
    if (drop && !drop.hidden && !e.target.closest('.find')) drop.hidden = true;
  });
})();
}

(function () {
  var q = new URLSearchParams(location.search);
  var fallback = { ok: false, dept: 'Chelsea Police Department', patch: 'https://i.imgur.com/Yu7RJhS.png' };
  var go = function (d) { DATA = d || {}; if (!DATA.dept) DATA.dept = fallback.dept; if (!DATA.patch) DATA.patch = fallback.patch; start(); };
  if (!q.get('c')) { fallback.message = 'Open the class sign-up link or scan the class QR code.'; go(fallback); return; }
  // Show the copy saved on this phone right away, then the fresh one.
  var key = 'ci-cls-' + q.get('c') + '-' + q.get('k'), saved = null, started = false;
  try { saved = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
  if (saved && saved.ok) { go(saved); started = true; }
  api('classPage', { c: q.get('c'), k: q.get('k') }).then(function (d) {
    if (d && d.ok) { try { localStorage.setItem(key, JSON.stringify(d)); } catch (e) {} }
    else { try { localStorage.removeItem(key); } catch (e) {} }
    if (!started) { go(d); return; }
    if (d && d.ok) { if (window.ciFresh) window.ciFresh(d); }
    else if (window.ciGone) window.ciGone((d && d.message) || "This class isn't available anymore.");
  }, function () {
    if (started) return;
    fallback.message = "Couldn't reach the sign-up page. Check your signal, then try the link again.";
    go(fallback);
  });
})();
</script>
</body>
</html>
